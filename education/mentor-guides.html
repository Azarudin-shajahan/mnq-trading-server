placement &amp; MSS (9:45–9:55)</h3>\n<p>Immediately after purging buy stops, price drops with heavy displacement, violently breaking a recent short-term swing low. <b>Nuance:</b> a valid MSS must be preceded by a liquidity raid, and does not require a body close below the swing — a wick with rapid displacement is sufficient.</p>\n<h3>Step 3 — the Silver Bullet FVG &amp; OTE (10:00)</h3>\n<p>The displacement leaves a 3-candle bearish FVG. At 10:00 we enter the Silver Bullet window and wait for price to retrace up into that inefficiency. <b>Nuance 1:</b> in a bearish FVG the upper half is balanced — the true inefficiency is the lower half. <b>Nuance 2:</b> anchor the fib from the displacement high down to the low using candle <i>bodies</i>, ignoring wicks.</p>\n<h3>Step 4 — exact entry &amp; stop</h3>\n<p>Key on the 62% level (over 70.5%/79%); note it aligns inside the lower half of the bearish FVG. Place a <b>sell limit at 62% − 5 pips</b>; the moment it's placed, the stop goes exactly <b>5 pips above the anchor swing high</b>.</p>\n<h3>Step 5 — target &amp; management</h3>\n<p>At 10:10 price taps the limit at the lower half of the FVG, stalls at the consequent encroachment (50% midpoint), and falls toward the SSL below yesterday's low. Manage mechanically: at 25% of objective reduce stop risk 25%; at 50% reduce 50%; at exactly <b>75%</b> — and only then — move the stop to break-even. Hold the final portion until price sweeps 10/20/30 pips below the old daily low, completing ERL → IRL → ERL delivery.</p>"},{"id":"nuances","title":"Nuances you must not miss","html":"\n<h3>Focus on candle bodies, not wicks</h3>\n<p>Bodies represent true institutional volume; wicks often represent erroneous, spread-driven retail action. Look for liquidity resting just above/below the <i>bodies</i> of previous highs and lows.</p>\n<h3>The \"classic chart pattern\" trap</h3>\n<p>Double tops, bull flags, head-and-shoulders are engineered market-maker traps to build pools of retail stops — smart money drives price through them to absorb that liquidity and pair its own orders.</p>\n<h3>Misunderstanding market efficiency</h3>\n<p>Retail buys breakouts; smart money <b>fades</b> them. In a bearish HTF trend, any short-term move above an old high is an engineered run on buy stops to let banks sell short at a premium.</p>\n<h3>The 80% ADR rule for New York</h3>\n<p>Don't trade the NY killzone every day — if London already fulfilled 80%+ of the 5-day Average Daily Range, move to the sidelines and skip NY; it will likely chop or catch you in an unpredictable reversal.</p>\n<h3>The \"London Lunch\" squeeze</h3>\n<p>The 5:00–7:00 AM NY window (London Lunch) frequently creates a sharp retracement/consolidation that squeezes open profits — always take partial profits before 5:00 AM NY.</p>\n<h3>Use the correct \"True Day\" open</h3>\n<p>Don't use 00:00 GMT to frame the Power-of-3 Judas Swing for London/NY day trading — the True Day always begins at <b>midnight New York time</b>.</p>\n<h3>The \"lethargic response\" warning</h3>\n<p>At a PD array, monitor the immediate reaction — if it's lethargic, stalling, or lacks dynamic expansion, institutional sponsorship is absent; reduce risk or abandon the trade.</p>\n<h3>Mean-threshold violations</h3>\n<p>The mean threshold is the 50% mark of the order block's <i>body</i>; a valid, sponsored OB should never see price close or significantly trade beyond that midpoint.</p>\n<h3>Divergence phantoms (the indicator trap)</h3>\n<p>Price has zero awareness of your indicators — market makers use indicator divergences (e.g. Stochastic) as \"phantoms\" to trap retail into picking a top while smart money makes one more run on the stops.</p>\n<h3>The higher-timeframe arm-wrestling match</h3>\n<p>Never trade a 15m/1h setup that opposes the Daily/Weekly order flow — in a timeframe \"arm wrestling match,\" the higher timeframe always wins.</p>\n<h3>The fear of taking partial profits</h3>\n<p>Scale out at logical low-hanging objectives — demanding your whole position hit the final HTF objective usually turns a winner into a stop-out.</p>"},{"id":"grounding","title":"Grounding & sources","html":"\n<p>This guide is transcribed faithfully from ICT's NotebookLM notebooks — Charter Models (<code>dd17ad76…</code>) and Core Content 2016–17 (<code>b2c21c14…</code>), built from the <b>@InnerCircleTrader</b> channel. It is deliberately <b>bounded to ICT's teaching core</b> (PD arrays, liquidity, killzones, OTE, Power-of-3, MSS — the vocabulary the other four mentors build on), not the full 600+ lecture archive. Every claim traces to a NotebookLM answer grounded in that corpus; the bracketed <code>[n]</code> citations in the underlying answers map to individual source videos. Nothing here is imported from outside the corpus. Note: ICT taught killzones in a <b>forex</b> context and index-futures sessions around the 9:30 equities open — the Timing section sorts them by instrument class (index-futures = what applies to MNQ). The London 1:00–5:00 vs 2:00–5:00 AM difference is within his forex-killzone framing (and DST adjustment), not a forex-vs-futures split. The \"5 pip\" entry buffer and \"10/20/30 pip\" liquidity-run figures are forex-specific; index futures use points/handles (no exact equivalent given in the corpus).</p>"}]},{"id":"dexter","name":"Dexter","tagline":"owns TARGETS — Power-of-3 & standard-deviation projections","sections":[{"id":"thesis","title":"Core thesis","html":"\n<p>Dexter views the market as a highly synchronized, algorithmic machine governed entirely by overlapping <b>Power of Three (PO3)</b> cycles — Accumulation, Manipulation, and Distribution — anchored strictly to specific opening time levels like the midnight, 10:00 AM, weekly, or monthly opens, rather than random time windows. He reads delivery by first establishing a Higher Time Frame (HTF) directional bias toward an <i>opposing</i> HTF PD array as the ultimate destination, then dropping to lower time frames to precisely measure the manipulation phase of the current PO3. The core mechanic is to identify the \"most discernible range\" of that manipulation (a clear swing high to swing low) and project standard deviations from it to mathematically map the exact boundaries of the ensuing distribution phase. A crucial nuance a student must not miss: <b>time itself is treated as a rigid support/resistance barrier</b> — a high-probability trade or reversal is only validated when a distinct time element (such as a specific open price) overlaps precisely with a price element (an HTF PD array) exactly at the 2–2.5 or 3.5–4 standard-deviation terminus. And every genuine shift between PO3 phases — such as the transition from manipulation into a smart-money-reversal distribution — is invariably confirmed by an <b>SMT divergence</b> between correlated assets, serving as the definitive mechanical trigger to trust the change in the state of delivery.</p>"},{"id":"model","title":"The market model","html":"\n<p>To understand Dexter's model you must first accept his core thesis: the market does not move randomly; it is an algorithmic machine governed by overlapping <b>Power of Three (PO3)</b> cycles. Every candle — 1-minute, 4-hour, daily, or monthly — undergoes a strict three-phase cycle of <b>Accumulation → Manipulation → Distribution</b>, anchored to a specific time-based opening price (Midnight, 10:00 AM, the Weekly Open, etc.). Standard Deviations (STDV) are the mathematical ruler used to project where those phases begin and end — but you must <b>never apply standard deviations blindly</b>. Without first establishing an HTF directional premise (a path from one HTF PD array to an opposing HTF PD array), using standard deviations will lead to losses.</p>\n<h3>Step 1 — Identify the HTF premise and the open</h3>\n<p>Before drawing anything, identify your HTF draw on liquidity (Point A → Point B). Once direction is set, identify the exact time the relevant PO3 candle opens (e.g. the 10:00 AM 4-hour candle open).</p>\n<ul>\n<li><b>Accumulation</b> occurs at and around this opening price — price builds volume, moving up and down without heavy displacement.</li>\n<li><b>Manipulation</b> is a deceptive move engineered in the <i>opposite</i> direction of your true HTF bias. Its purpose is to sweep external liquidity or tap into an HTF PD array — this physically forms the \"wick\" of the HTF candle.</li>\n</ul>\n<h3>Step 2 — Measure the sample size (the projection leg)</h3>\n<p>Once manipulation occurs, use it as your \"sample size\" to project the true expansion (distribution). Identify the \"most discernible range\" within the manipulation phase — typically a clear swing high to a recent broken swing low. <b>Nuance:</b> if a standard swing high/low isn't clear, you can anchor the STDV tool from a swing point directly to the exact time opening (like the 10:00 AM open), or measure the extreme high/low of an HTF candle wick.</p>\n<h3>Step 3 — Navigating the standard-deviation map</h3>\n<p>Once the manipulation leg is projected forward, the algorithmic framework is set and price reacts to specific deviations:</p>\n<ul>\n<li><b>0 to 0.5 STDV (low-risk entry):</b> houses the \"Smart Money Reversal\" — the origin of the true distribution phase. Look for internal liquidity (the first order block or FVG) to execute a low-risk buy/sell.</li>\n<li><b>1 to 1.5 STDV (the Silver Bullet Zone):</b> the midpoint of the PO3 cycle and the highest-probability area to catch the move if you missed the initial reversal. Because the reversal is already confirmed, this zone is strictly for re-accumulation / redistribution — enter on internal liquidity (FVG/OB); if none exists, price will likely sweep internal stops before continuing.</li>\n<li><b>2 to 2.5 STDV (the primary terminus):</b> the standard target for the distribution phase. On reaching it, anticipate a retracement or a full Smart Money Reversal.</li>\n<li><b>3.5 to 4 STDV (unfinished business):</b> price only blows past 2.5 if the market has \"unfinished business\" — an opposing HTF PD array or liquidity pool not yet reached. Then 2–2.5 acts as a brief re-accumulation zone before heavy expansion pushes to 3.5–4 (or even 5).</li>\n</ul>\n<h3>Exact mechanics you must not miss</h3>\n<p><b>1. The SMT divergence requirement.</b> <i>Every single phase shift</i> in the state of delivery must be confirmed by an SMT divergence. When price hits the terminus and transitions from manipulation into true distribution (the Smart Money Reversal), one correlated asset sweeps a high/low while the other fails to. Without SMT confirmation you do not trust the reversal or phase shift.</p>\n<p><b>2. The Devil's Mark trap.</b> Normally a candle opens and immediately manipulates to print a wick. If a candle opens and immediately expands with massive velocity <i>without</i> printing an initial wick, that is a Devil's Mark — it looks like an incredibly strong breakout but signals a high probability that price will soon reverse to print the missing wick.</p>\n<p><b>3. Strict time-frame alignment.</b> You cannot map a standard deviation arbitrarily; there is a logical alignment between the HTF PD array target and the timeframe you measure the manipulation leg on: a <b>Monthly</b> PD array → measure STDV on Daily/12H; a <b>Weekly</b> PD array → 4H/8H/1H; a <b>Daily</b> PD array → 1H/30m/15m.</p>"},{"id":"glossary","title":"Concept glossary","html":"\n<h3>Power of Three (PO3)</h3>\n<p>The rigid, algorithmic three-phase cycle — Accumulation, Manipulation, Distribution — that governs every candle across all timeframes. <b>Nuance:</b> you can never measure or anticipate a PO3 without first anchoring it to a specific time-based opening price (10:00 AM, the equities open, the weekly open). Without knowing which PO3 is developing, standard deviations are useless.</p>\n<h3>Accumulation / Consolidation</h3>\n<p>The first phase, at and around the opening price, where price moves up and down without heavy displacement to build volume. <b>Nuance:</b> you don't have to wait for manipulation to measure — you can identify the \"most discernible range\" strictly inside accumulation and project deviations to anticipate where manipulation will end.</p>\n<h3>Manipulation</h3>\n<p>A deceptive trap engineered from the opening price to sweep external liquidity or tap an HTF PD array — physically forming the wick of the candle. <b>Nuance:</b> manipulation <i>always</i> moves opposite the true HTF bias, and that exact leg becomes the \"sample size\" used to map the distribution phase via standard deviations.</p>\n<h3>Distribution / Expansion</h3>\n<p>The true directional move after manipulation, forming the body of the candle. <b>Nuance:</b> its end is mathematically fixed — it typically terminates at the 2–2.5 STDV projection of the manipulation leg.</p>\n<h3>Most Discernible Range / Sample Size</h3>\n<p>The price leg used to anchor the STDV tool — typically a clear swing high to the most recent broken swing low within manipulation or accumulation. <b>Nuance:</b> anchors don't have to be standard swings; if ambiguous, combine a swing extreme with a specific time opening (e.g. swing high → 10:00 AM open) or measure the extreme of an HTF candle wick.</p>\n<h3>0 to 0.5 STDV (Low-Risk Buy/Sell)</h3>\n<p>The origin of the true distribution phase, immediately after the Smart Money Reversal. <b>Nuance:</b> look for the very first internal liquidity (first OB or FVG) for the low-risk entry; if none is present, price will likely sweep internal stops first.</p>\n<h3>1 to 1.5 STDV (Silver Bullet Zone)</h3>\n<p>The algorithmic midpoint of the PO3 cycle, the primary zone for re-accumulation / redistribution. <b>Nuance:</b> since the reversal is already confirmed by the time price reaches here, it's the safest high-probability area for secondary entries — enter on internal liquidity (FVG/OB) strictly within the 1–1.5 band.</p>\n<h3>2 to 2.5 STDV (the Terminus)</h3>\n<p>The standard target for the end of distribution. <b>Nuance:</b> blindly reversing at 2.5 fails without context — a high-probability reversal must overlap an HTF PD array and be confirmed by SMT; if there's unfinished business higher up, 2–2.5 becomes a brief re-accumulation zone instead of a reversal.</p>\n<h3>3.5 to 4 STDV (Unfinished Business)</h3>\n<p>The maximum expansion terminus, reached when 2–2.5 is blown through. <b>Nuance:</b> price only pushes here if the opposing HTF PD array or a major HTF liquidity pool further away hasn't been mitigated.</p>\n<h3>SMT Divergence (Smart Money Tool)</h3>\n<p>A cross-asset confirmation where one market (e.g. NASDAQ) sweeps a high/low while a correlated market (e.g. S&amp;P) fails to. <b>Nuance:</b> SMT is the mandatory confirmation for <i>every</i> change in the state of delivery — accumulation→manipulation, manipulation→distribution, and every re-accumulation. Without SMT you have no permission to trust the phase shift.</p>\n<h3>Devil's Mark</h3>\n<p>A visual trap where a candle opens and immediately explodes with massive velocity <i>without</i> printing an initial wick. <b>Nuance:</b> because the algorithm requires a wick to be printed, this deceptive breakout signals a high probability that price will soon violently reverse to the opening price to print the missing wick before continuing.</p>\n<h3>Market Maker Buy/Sell Model (MMXM)</h3>\n<p>The macro framework mapping delivery from one HTF PD array to an opposing HTF PD array. <b>Nuance:</b> Dexter maps the whole MMXM through standard deviations — the Smart Money Reversal at 0–0.5, the re-accumulation / Silver Bullet Zone at 1–1.5, and the final HTF PD array at the 2–2.5 or 3.5–4 terminus.</p>\n<h3>Smart Money Reversal (SMR)</h3>\n<p>The exact pivot where manipulation ends and true distribution begins. <b>Nuance:</b> never random — it must occur at the precise intersection of a Time Element (weekly/monthly open), a Price Element (HTF PD array), a Standard-Deviation Terminus (2–2.5 or 3.5–4), and be validated by an SMT divergence.</p>\n<h3>Time Elements / Openings</h3>\n<p>Specific anchor times (Midnight, 10:00 AM, equities open, weekly open, monthly open) marking the start of PO3 cycles. <b>Nuance:</b> time itself is treated as hard support/resistance — a mechanical confirmation of a reversal or phase shift only occurs when a lower-timeframe candle body definitively closes above/below the exact price level of an HTF time element.</p>\n<h3>Turtle Soup</h3>\n<p>A false breakout sweeping external liquidity (a previous high/low). <b>Nuance:</b> Dexter uses it synonymously with the peak of manipulation / the Smart Money Reversal at a terminus — the physical sweep that must be backed by an SMT to be valid.</p>\n<h3>Event Horizon</h3>\n<p>From his custom indicators — the single most important level inside each weekly PO3 framework. <b>Nuance:</b> it acts as a constant inflection point and algorithmic magnet that stays relevant throughout the entire week's delivery, outranking standard daily levels.</p>"},{"id":"timing","title":"Timing & sessions","html":"\n<p>To use Dexter's method you must change how you view time: time levels are <b>hard support and resistance</b>, not just volatility windows. Every cycle is anchored to a specific HTF opening price (Midnight, 10:00 AM, equities, weekly, monthly), and knowing <i>which</i> time element is in play dictates which PO3 phase is delivering.</p>\n<h3>High-impact news & economic drivers (8:30 AM &amp; 10:00 AM)</h3>\n<p>Dexter treats releases like NFP / Unemployment Claims (8:30) and JOLTS (10:00) as \"economic drivers\" that construct specialized algorithmic ranges. When a driver hits, the algorithm initiates an accumulation phase to engineer liquidity; for a 10:00 driver, the <b>10:00–10:30 window is dedicated to trapping traders</b>, sweeping both buy- and sell-side liquidity. <b>Nuance:</b> don't catch the initial spike — the real window only begins after price closes completely outside the initial 30-minute accumulation range (e.g. after 10:30). The exact news open price is your directional filter: a 5-minute body closing above it mathematically confirms bullish expansion.</p>\n<h3>The Tuesday Reversal Profile</h3>\n<p>Tuesday is the algorithmic day for a weekly PO3 reversal. If the weekly chart has aggressively expanded and reaches the <b>3.5–4 STDV terminus exactly on a Tuesday</b>, a macro reversal is highly probable. <b>Nuance:</b> you don't blindly buy/sell just because it's Tuesday at a terminus — you must wait for a lower-timeframe candle body to shift structure and close back above/below a specific HTF time element (Weekly Open or the monthly open). That intersection of time and price is the trigger.</p>\n<h3>Friday (the weekly close)</h3>\n<p>Friday dictates the final distribution or closure of the weekly PO3. Dexter approaches it based on what the week failed to do — if Thursday closed below the weekly open (distribution hasn't printed), Friday becomes the explosive day toward the HTF draw on liquidity. <b>Nuance:</b> if the weekly candle has <i>already</i> heavily expanded into a terminus by Friday morning, adapt — the algorithm will either seek a continuation to clear unfinished business (an unbalanced HTF FVG), or reverse back to the range low to close the week as a doji.</p>\n<h3>End of Month (EOM) / End of Quarter (EOQ)</h3>\n<p>By the last day of the month/quarter, the macro PO3 has almost certainly already finished distribution and hit its 2.5 or 3.5 terminus. <b>Nuance:</b> because the macro expansion is mathematically over, heavy directional moves are unlikely — abandon swing trading; EOM/EOQ are <b>exclusively for patience and short-term intraday scalping</b> between localized internal liquidity pools.</p>"},{"id":"setups","title":"Signature setups, step-by-step","html":"\n<h3>4H Power-of-Three Expansion</h3>\n<ul>\n<li><b>Context:</b> the open of a 4H candle mapping delivery from an origin HTF PD array (A) to an opposing HTF PD array (B).</li>\n<li><b>Trigger:</b> an accumulation range forms at the 4H open, manipulates above/below the open to reach the 2–2.5 STDV projection of that range, and forms an SMT divergence in the highs/lows.</li>\n<li><b>Entry:</b> Entry 1 at the order block ending the manipulation; Entry 2 at the first FVG of the initial displacement; Entry 3 at internal liquidity inside the 1–1.5 STDV Silver Bullet Zone.</li>\n<li><b>Stop:</b> above/below the manipulation extreme or HTF-PD-array invalidation (Dexter under-specifies the exact stop).</li>\n<li><b>Target:</b> the 2–2.5 STDV level, with potential extension to 3.5–4 or an unbalanced 4H FVG.</li>\n<li><b>Nuance:</b> every phase shift must be confirmed by an SMT divergence — without it you cannot trust the reversal.</li>\n</ul>\n<h3>Market Maker Buy/Sell Model (MMXM)</h3>\n<ul>\n<li><b>Context:</b> HTF PO3 delivery (Daily/Weekly/Monthly) mapping a macro route from one HTF PD array to an opposing one.</li>\n<li><b>Trigger:</b> price reaches an HTF PD array exactly at the 2–2.5 or 3.5–4 terminus of the previous manipulation range and forms a Smart Money Reversal.</li>\n<li><b>Entry:</b> the low-risk buy/sell at the 0–0.5 band (first OB/FVG), or re-accumulate at the 1–1.5 band on internal liquidity.</li>\n<li><b>Stop:</b> invalidation of the macro HTF PD array.</li>\n<li><b>Target:</b> the opposing HTF PD array (Point B/C) and its terminus.</li>\n<li><b>Nuance:</b> only anticipate continuation past 2–2.5 (toward 3.5–4) if the HTF has unfinished business — an unmitigated HTF liquidity pool or PD array.</li>\n</ul>\n<h3>Tuesday Reversal Profile</h3>\n<ul>\n<li><b>Context:</b> a weekly PO3 macro cycle specifically on a Tuesday.</li>\n<li><b>Trigger:</b> the weekly chart has aggressively expanded and reaches the 3.5–4 STDV terminus on Tuesday.</li>\n<li><b>Entry:</b> wait for a lower-timeframe candle body to shift structure and close back above/below a specific HTF time element (Weekly or monthly open).</li>\n<li><b>Stop:</b> beyond the 3.5–4 terminus extreme.</li>\n<li><b>Target:</b> the previous daily low/high, Monday's low, or a daily buy-/sell-side imbalance.</li>\n<li><b>Nuance:</b> never catch a falling knife just because it's Tuesday at a terminus — require the intersection of a time element and a price element, confirmed by a candle-body close.</li>\n</ul>\n<h3>High-Impact News / Economic Driver (NFP &amp; JOLTS)</h3>\n<ul>\n<li><b>Context:</b> a driver-release window — NFP/Unemployment (8:30) or JOLTS (10:00).</li>\n<li><b>Trigger:</b> the first 30 minutes (e.g. 10:00–10:30) is dedicated to engineering liquidity, trapping traders by sweeping both external buy- and sell-side liquidity.</li>\n<li><b>Entry:</b> wait for price to close entirely outside the initial 30-minute range, then enter on a retracement to an FVG/inversion once a 5- or 15-minute body closes above/below the exact news open price.</li>\n<li><b>Stop:</b> invalidation of the news-range boundaries.</li>\n<li><b>Target:</b> the HTF draw on liquidity or opposing external liquidity outside the engineered range.</li>\n<li><b>Nuance:</b> do not trade the initial spike; the news open price is the directional filter, and the midpoint of the news range acts as super support/resistance.</li>\n</ul>\n<h3>Silver Bullet Zone Continuation</h3>\n<ul>\n<li><b>Context:</b> the intraday distribution/expansion phase of a developing PO3.</li>\n<li><b>Trigger:</b> price finishes manipulation, confirms a Smart Money Reversal, and reaches the 1–1.5 STDV level of the projected range.</li>\n<li><b>Entry:</b> exclusively on internal liquidity (FVG/OB) strictly within the 1–1.5 band; if no FVG exists, wait for a sweep of internal stops before continuing.</li>\n<li><b>Stop:</b> invalidation of the Silver Bullet FVG or accumulation level.</li>\n<li><b>Target:</b> the 2–2.5 STDV terminus.</li>\n<li><b>Nuance:</b> this midpoint sits after the reversal is already confirmed — the safest place to catch a secondary entry if you missed the extreme.</li>\n</ul>\n<h3>Devil's Mark Reversal</h3>\n<ul>\n<li><b>Context:</b> a PO3 time opening (e.g. 6:00 AM) where a candle opens and immediately expands heavily.</li>\n<li><b>Trigger:</b> the candle opens and explodes with massive velocity <i>without</i> printing an initial wick, reaching an HTF PD array or a 2–2.5 terminus.</li>\n<li><b>Entry:</b> on the reversal displacement away from the terminus.</li>\n<li><b>Stop:</b> above/below the standard-deviation terminus level.</li>\n<li><b>Target:</b> the exact opening price of the current candle (to print the missing wick).</li>\n<li><b>Nuance:</b> it's a visual trap that looks strong to retail; most lethal when it moves opposite your established HTF bias.</li>\n</ul>\n<h3>End of Month / End of Quarter Scalp</h3>\n<ul>\n<li><b>Context:</b> intraday trading strictly on the final day of a month/quarter.</li>\n<li><b>Trigger:</b> the macro PO3 (Monthly/Quarterly) has already reached its 2.5–3.5 terminus before the session.</li>\n<li><b>Entry:</b> scalp entries after the morning driver (e.g. 10:00–10:30) builds and sweeps its localized accumulation range.</li>\n<li><b>Stop:</b> under-specified.</li>\n<li><b>Target:</b> localized intraday buy-/sell-side internal liquidity (e.g. a daily FVG).</li>\n<li><b>Nuance:</b> the macro expansion is mathematically finished for the period — abandon swing logic; these days are for patience and localized scalping only.</li>\n</ul>"},{"id":"example","title":"Worked example","html":"\n<p>A live-chart narration of Dexter's premier setup — the <b>Tuesday Reversal Profile</b> aligned with a macro standard-deviation terminus. It's his highest-conviction model because it combines the strongest algorithmic timing with a mathematically fixed exhaustion point, removing ambiguity.</p>\n<h3>Step 1 — the macro framework (setting the trap)</h3>\n<p>Look at the weekly chart: price has been heavily bullish all week, expanding aggressively without a meaningful pullback. Project the standard-deviation tool from the initial weekly accumulation/manipulation range — price has just pierced the 3.5–4 STDV zone. And it's Tuesday. A weekly chart already at the 3.5–4 terminus by Tuesday is not a continuation environment; it's a highly probable exhaustion zone. <b>Nuance:</b> you don't just sell — you need a Time Element to overlap a Price Element. Here the 3.5–4 zone overlaps an HTF bearish order block (price element) and the July monthly open (time element). The trap is set.</p>\n<h3>Step 2 — the algorithmic shift (waiting for the trigger)</h3>\n<p>Drop to lower timeframes; in two minutes the new 30-minute PO3 candle opens. As it opens, price pushes up one last time to sweep external liquidity — NASDAQ makes a higher high into the July open but the S&amp;P fails to: an <b>SMT divergence</b>, the mandatory confirmation that smart money is shifting into distribution. <b>Nuance:</b> even with SMT at the terminus, you still don't enter — wait for the 30-minute body to close back <i>below</i> the July open and the 30-minute open. Only then is the reversal mechanically confirmed.</p>\n<h3>Step 3 — execution (entry &amp; stop)</h3>\n<p>The 30-minute candle closes below the July open, leaving a bearish FVG. Execute the short on the retracement into that FVG, or anywhere inside the 1–1.5 STDV Silver Bullet Zone of the new lower-timeframe bearish range. Risk goes just above the 30-minute open and the highest wick of the manipulation — if price crosses back above, the premise is dead.</p>\n<h3>Step 4 — management &amp; targets (paying the trader)</h3>\n<p>Price begins its heavy bearish displacement; pay the trader at logical liquidity pools. The first draw is the Tuesday low and previous daily low — take heavy partials as price sweeps below the previous daily low. Manage the runner toward the ultimate macro destination: Monday's low and the unmitigated daily buy-side imbalance beneath it. The 30-minute PO3 was enough to make the money.</p>"},{"id":"nuances","title":"Nuances you must not miss","html":"\n<h3>1. Don't trade standard deviations blindly</h3>\n<p>The single biggest mistake: applying STDV to random swings without an HTF premise. Deviations alone do not predict the market. You must first have a logical HTF origin (A) and destination (B) using HTF PD arrays; the lower-timeframe deviations are merely rulers for retracements, secondary entries, and profit zones <i>along the way</i> to that target.</p>\n<h3>2. The \"unfinished business\" trap at the terminus</h3>\n<p>The target is typically 2–2.5 STDV, but don't blindly reverse the moment price touches it. Only trust a reversal there if the HTF objective is complete. If there's an unmitigated HTF liquidity pool or PD array further away, 2–2.5 becomes a brief re-accumulation zone before expansion continues to 3.5–4.</p>\n<h3>3. The Devil's Mark illusion</h3>\n<p>A candle that opens and immediately expands with high velocity and no initial wick looks incredibly strong and tricks retail into a breakout. It's a trap: because the algorithm requires a wick, that move signals a high probability of a violent reversal back to the opening price to print the missing wick.</p>\n<h3>4. Rigid target fixation / unrealistic projections</h3>\n<p>Traders pick an arbitrary distant swing, project deviations, and get stopped out waiting for a target that never hits. Dexter warns against \"working with parents\" — don't anchor to a massive distant swing that doesn't align with current price action. Use a realistic projection (e.g. a localized swing extreme to the 10:00 AM open); realistic anchors near price actually get hit.</p>\n<h3>5. Misreading \"time\" as just a killzone</h3>\n<p>Times like Midnight, 10:00 AM, and the Weekly Open are not merely volatility windows. Treat them as literal hard support/resistance; a true phase-shift confirmation is only valid when a candle body cleanly closes above/below those specific time elements.</p>\n<h3>6. Confusing distribution with manipulation</h3>\n<p>Manipulation is only one phase. Once it ends and true distribution begins, stop looking for deep pullbacks to equilibrium — during distribution, price only takes the most recent internal FVG or localized liquidity before continuing rapidly. Waiting for a deep retracement makes you miss the move.</p>\n<h3>7. Expecting macro expansion at cycle end (EOM/EOQ)</h3>\n<p>By the last day of a month/quarter the macro PO3 has almost certainly finished its heavy expansion and hit its terminus. Holding for big macro targets is a mistake — these days are for patience and intraday scalping between localized internal liquidity.</p>\n<h3>8. Trading the initial news spike</h3>\n<p>During NFP/JOLTS, the algorithm deliberately uses the first 30 minutes to engineer liquidity and trap traders on both sides — the first move is a trap. The true move begins only after that initial accumulation range closes, and the exact news open price is the ultimate directional filter (a candle body must close beyond it to confirm direction).</p>"},{"id":"grounding","title":"Grounding & sources","html":"\n<p>This guide is transcribed faithfully from Dexter's NotebookLM notebook (<code>84499947…</code>), built from his YouTube channel <b>@MonsterLab7</b> (Power-of-3 + standard-deviation content). Every claim above traces to a NotebookLM answer grounded in that corpus; the bracketed <code>[n]</code> citations in the underlying answers map to the individual source videos in the notebook. Nothing here is imported from outside the corpus — where Dexter's material under-specifies a detail (e.g. exact stop placement), that is noted rather than filled in.</p>"}]}];

  var toc=g.sections.map(function(s){return '<a href="#'+s.id+'">'+esc(s.title)+'</a>';}).join('');
  var secs=g.sections.map(function(s){return '<section class="gsec"><h2 id="'+s.id+'">'+esc(s.title)+'</h2>'+(s.html||'<p class="nc">Not covered in this mentor\'s corpus.</p>')+'</section>';}).join('');
  host.innerHTML='<div class="ghead"><h1>'+esc(g.name)+'</h1><div class="tag">'+esc(g.tagline||'')+'</div></div><nav class="toc">'+toc+'</nav><main class="body">'+secs+'</main>';
  window.scrollTo(0,0);
}
