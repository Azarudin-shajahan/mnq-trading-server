<div class="bhead"><h1>Mentor Deep-Guides</h1><p>Offline copy · sourced from NotebookLM · tap a mentor</p></div>

<script>
var GUIDES=[{"id":"ttrades","name":"TTrades","tagline":"owns BIAS — the fractal daily candle (C1→C2→C3), 'let the wick form, trade the body'","sections":[{"id":"thesis","title":"Core thesis","html":"\n<p>TTrades views the market as inherently <b>fractal</b>: every daily candle mechanically constructs an Open-High-Low-Close (OHLC) or Open-Low-High-Close (OLHC) profile out of lower-timeframe structural swings. To set a <b>mechanical daily bias without guessing</b>, you wait for a \"Candle 2\" (C2) closure — when a daily candle sweeps the extreme high/low of the previous candle into a higher-timeframe point of interest and then <i>closes back inside</i> that previous candle's range. A critical nuance is <b>wick size</b>: a small wick proves the daily extreme formed early, leaving ample range for a smooth directional expansion; a large opposing wick signals range exhaustion, where you conservatively pull targets back to the daily open. Once bias is set, the core execution thesis is to <b>let the wick form, then trade the body</b> of the expanding higher-timeframe candle. To define mechanically when the wick is finished, you drop to an aligned intermediate timeframe (1H/4H) and wait for an intracandle Change in the State of Delivery (CISD) — a decisive close through the opening price of the opposing order block that drove price to the high/low. That intracandle CISD confirms the daily wick is now a <b>protected swing</b>, giving you the green light to drop to an entry timeframe and trade continuations into the aggressive body of the daily candle toward higher-timeframe draws on liquidity.</p>"},{"id":"model","title":"The market model","html":"\n<p>TTrades' foundational model rests on one premise: the market is fractal — the OHLC profile of a higher-timeframe (HTF) daily candle is mechanically built from internal lower-timeframe (LTF) structural swings. The goal is to predict which days will be aggressive, one-sided expansion candles, then drop to lower timeframes to capture the bulk of that move.</p>\n<h3>Step 1 — Mechanical daily bias: the C1 → C2 → C3 sequence</h3>\n<ul>\n<li><b>Candle 1 (C1) — the reference:</b> the previous daily candle that establishes the immediate range.</li>\n<li><b>Candle 2 (C2) — the reversal closure:</b> the ultimate reversal signature — the current daily candle sweeps C1's extreme high/low into an HTF point of interest (FVG or older swing), then decisively <b>closes back inside C1's range</b>.</li>\n<li><b>The wick-size nuance:</b> a C2 sweep is only tradable for immediate expansion if it has a <b>small wick</b> — proving the reversal happened early, leaving range and time to expand. A <b>large wick</b> (a massive opposing run) has exhausted the daily range: pull targets back to the daily open, or skip and wait for the next day (C3).</li>\n<li><b>Candle 3 (C3) — the expansion:</b> once a valid C2 sets direction, C3 is the anticipated expansion continuation — the day to trade aggressively toward the opposing draw on liquidity.</li>\n<li><b>Candle 4 (C4) — further continuation:</b> if C3 closes strong (body closes entirely beyond C2's high/low), momentum is extreme and C4 can be another expansion day.</li>\n</ul>\n<h3>Step 2 — Top-down timeframe alignment</h3>\n<p>Never trade the daily expansion blindly. Align three timeframes: an HTF for <b>bias</b> (Daily), a middle TF for <b>structure</b> (4H/1H), and an LTF for <b>entry</b> (15m/5m). True expansion only occurs when all three align in the same direction.</p>\n<h3>Step 3 — \"Let the wick form, trade the body\"</h3>\n<p>Never try to catch the absolute top/bottom of a daily move — let the HTF candle's wick form, then trade the body.</p>\n<ul>\n<li><b>The intracandle CISD (IC-CISD):</b> to define exactly when the HTF wick is finished, drop to your structural timeframe. When the C3 daily candle opens, the LTF initially trends the <i>wrong</i> way to build the wick; wait for it to hit a POI and print an IC-CISD.</li>\n<li><b>The mechanical trigger:</b> an IC-CISD is confirmed only when price aggressively <b>closes through the opening price of the opposing order block</b> that drove price to the extreme.</li>\n<li><b>Protected swing &amp; entry:</b> that closure converts the extreme into a <b>protected swing</b> — the wick is locked in and shouldn't be violated the rest of the day. With your stop anchored behind it, drop to the entry timeframe and execute continuations into the body toward external liquidity.</li>\n</ul>"},{"id":"glossary","title":"Concept glossary","html":"\n<h3>CISD — Change in the State of Delivery</h3>\n<p>A shift in trend (bull↔bear): price reaches an important HTF level (a PD array or liquidity sweep), then displaces and closes past the <i>opening price</i> of the opposing candle(s) that drove it there. <b>Nuance:</b> a CISD is not a Market Structure Shift — an MSS needs a close past a swing high/low, whereas a CISD only needs a close past the opening price of the opposing candles (validating a new order block). CISD gets you in much earlier than waiting for a structural break.</p>\n<h3>IC-CISD — Intracandle CISD</h3>\n<p>A CISD that occurs on a lower timeframe <i>inside</i> a developing HTF candle. <b>Nuance:</b> this is the mechanical definition that confirms an HTF wick has finished forming — once the IC-CISD prints, the wick is locked, giving the green light to trade the expansion of the body.</p>\n<h3>Protected Swing (protected high/low)</h3>\n<p>A structural high/low expected to stay intact as the trend continues — formed when price hits a POI (sweeps a low, taps an FVG) and then makes a CISD by closing through the opposing candles. <b>Nuance:</b> a swing is <i>not</i> protected just because it looks like a high/low — it must hit an important level AND have the opposing candles closed through. This is your mechanical stop-loss anchor; if a protected swing is closed through, the trade idea is invalidated.</p>\n<h3>The T-Spot</h3>\n<p>The area where TTrades expects the wick of an HTF expansion candle to form — often in the upper/lower half of the previous candle's range. <b>Nuance:</b> it's an open-ended POI — never blindly place limit orders there; wait for price to drop into the T-Spot and form an LTF confirmation (a 1-minute inversion FVG or an IC-CISD) before trading the expansion out of the zone.</p>\n<h3>The Unicorn Model</h3>\n<p>An entry pattern combining a breaker block with an overlapping fair value gap. <b>Nuance:</b> to be valid it must begin with a liquidity sweep (stop hunt) forming the breaker (e.g. Low, High, Lower Low, Higher High); the displacement must slice cleanly through the breaker and leave an FVG precisely inside it. Enter at the breaker or wait for the FVG, stop below the breaker low.</p>\n<h3>The Fractal Model (TTFM)</h3>\n<p>TTrades' foundational top-down strategy, built on the logic that the market can't reverse without forming a swing point — mechanically aligning an HTF bias with a structural TF and an entry TF. <b>Nuance:</b> the goal is never to catch the absolute reversal; it aims to trade \"Candle 3\" (the continuation expansion) simultaneously across timeframes — a daily C3, an hourly C3, and an LTF protected swing all aligned.</p>\n<h3>The Easiest Draw (on liquidity)</h3>\n<p>The most obvious high-probability daily targets: the Previous Day High (PDH) and Previous Day Low (PDL). <b>Nuance:</b> unless the market is consolidating, price reaches for the previous day's extreme almost every day — so if the trend is bullish, anticipate the PDH; if price sweeps the PDH and fails to displace (closes back inside), the easiest draw flips and you target the PDL next.</p>\n<h3>Weekly Profiles</h3>\n<p>Structural blueprints for how the weekly candle develops across its five days (Classic Expansion, Consolidation Reversal, Intraweek Reversal, Thursday Counter). <b>Nuance:</b> don't use them to predict the week in advance — wait for the high/low of the week to actually form and confirm (e.g. a Tuesday C2 closure), then the profile gives you narrative permission to trade the continuations (C3/C4) for the rest of the week.</p>"},{"id":"timing","title":"Timing & sessions","html":"\n<p>For TTrades, <i>when</i> you trade is as strictly ruled as <i>how</i>. He filters out low-probability environments by operating in specific sessions, executing off precise HTF candle opens, and filtering days by weekly profile and news.</p>\n<h3>Session — the New York AM focus</h3>\n<p>Execution is primarily in the <b>NY AM killzone (8:30–11:30 EST)</b>. Wait for the 8:30 news embargo to lift or the 9:30 equities open to inject volatility. Inside it sits the stricter <b>Silver Bullet window (10:00–11:00 EST)</b> — if a setup (sweeping the 9:00 hourly candle's extremes) doesn't present in that 60 minutes, no Silver Bullet trade. <b>Nuance:</b> you do not execute in the Asian or London sessions — you use them as <i>data</i> to identify the Accumulation and Manipulation phases; NY is where you catch the Distribution (the clean displacement / large-range body).</p>\n<h3>HTF candle opens — the 10:00 AM &amp; 2:00 PM macros</h3>\n<p>10:00 and 14:00 EST mark the open of new <b>4-hour candles</b> on index futures. Trade the 4H Power of Three: monitor the open, wait for a shallow run the wrong way, and look for an IC-CISD on a lower timeframe (e.g. 5m) to confirm the reversal. <b>Nuance:</b> the rule is \"let the wick form, then trade the body\" — never blindly enter exactly at 10:00; wait for the new 4H candle to form its protective wick, then trade the continuation into the body.</p>\n<h3>Weekly profile days — the \"No Monday\" rule &amp; news protocol</h3>\n<ul>\n<li><b>No Monday:</b> TTrades explicitly avoids Mondays — no prior weekly data, rarely high-impact news, and statistically the smallest daily ranges (under 25% of average). Treat Monday as an accumulation day, pure data for Tue–Fri.</li>\n<li><b>High-impact news protocol:</b> avoid trading <i>before</i> the week's first high-impact event (CPI, FOMC, NFP) — pre-news days are prone to consolidation and trapped order flow. News is the trigger that manipulates the range; execute post-release or on the following days.</li>\n<li><b>Best day:</b> <b>Thursday</b> is typically highest-probability, as the bulk of the weekly range is distributed following mid-week news.</li>\n<li><b>Friday (TGIF):</b> conditional — if the market already expanded three straight days (Tue/Wed/Thu) and hit an HTF objective, don't seek more expansion; look for a \"TGIF\" fade, anticipating a retrace into the weekly range to form the weekly candle's wick.</li>\n</ul>"},{"id":"setups","title":"Signature setups, step-by-step","html":"\n<h3>1. Fractal Model C2 Reversal (TTFM Candle 2)</h3>\n<ul>\n<li><b>Context:</b> price reaches an HTF POI (old high/low, PDH/PDL, weekly extreme, or HTF FVG).</li>\n<li><b>Trigger:</b> the HTF candle sweeps C1's extreme but fails to displace, closing back inside C1's range; then, on an aligned structural TF (e.g. 1H for a daily setup), a CISD confirms — a candle closes through the opening price of the opposing order block that drove price to the extreme.</li>\n<li><b>Entry:</b> drop to execution TF (5m/15m); enter on the CISD-confirming close or on a slight retest of that block.</li>\n<li><b>Stop:</b> at the absolute swing extreme — the newly confirmed protected high/low.</li>\n<li><b>Target:</b> the equilibrium of the HTF range, the opposing PDH/PDL, or a 2R minimum.</li>\n<li><b>Nuance (wick size):</b> only trade C2 directly if the HTF candle has a <b>small wick</b>; a massive opposing wick means the range is exhausted — pull targets to the daily open and wait for C3.</li>\n</ul>\n<h3>2. IC-CISD (Intracandle CISD)</h3>\n<ul>\n<li><b>Context:</b> a confirmed HTF bias, anticipating an expansion continuation day (C3/C4); executing \"let the wick form, trade the body\".</li>\n<li><b>Trigger:</b> inside the developing HTF candle the LTF trends the wrong way to form the wick, dropping into the T-Spot; the IC-CISD is the LTF shifting back into trend by closing through the opposing order block — locking the HTF wick.</li>\n<li><b>Entry:</b> on the close that validates the continuation order block, or a slight retest.</li>\n<li><b>Stop:</b> tucked tightly behind the new protected swing.</li>\n<li><b>Target:</b> HTF external liquidity (old highs/lows) or a 2R minimum.</li>\n<li><b>Nuance (timing):</b> the IC-CISD must form <b>early</b> in the HTF candle's life so there's range left to expand; if it forms near the end of the window, skip it and wait for the next HTF candle.</li>\n</ul>\n<h3>3. The Unicorn Model (Breaker + FVG)</h3>\n<ul>\n<li><b>Context:</b> typically in a high-volatility killzone (e.g. the 9:30 NY open) after price taps an HTF POI.</li>\n<li><b>Trigger:</b> a structural stop hunt (e.g. High, Low, Higher High) then an aggressive displacement that shifts structure (Lower Low) — slicing cleanly through the last opposite-colored candle (the breaker) and leaving an FVG precisely overlapping it.</li>\n<li><b>Entry:</b> at the overlapping zone — a blind limit at the start of the breaker, or a deeper retrace into the FVG for better R:R.</li>\n<li><b>Stop:</b> just beyond the breaker/FVG overlap, or at the absolute swing extreme.</li>\n<li><b>Target:</b> a fixed 2R, or HTF external liquidity (session highs/lows).</li>\n<li><b>Nuance:</b> a random breaker or random FVG is invalid — the displacement candle's FVG must share the same price territory as the breaker's body. Execute emotionlessly: set limit entry, stop, and TP; <b>never accept a break-even trade</b> or trail out of fear — let it hit TP or the stop.</li>\n</ul>\n<h3>4. TTFM Continuation (Candle 3 / Candle 4)</h3>\n<ul>\n<li><b>Context:</b> bias locked by a prior C2/C3 closure; trading strictly with trend momentum on an anticipated one-sided expansion day.</li>\n<li><b>Trigger:</b> price makes a shallow retrace into a POI (an FVG or short-term liquidity sweep), then aggressively displaces back into trend, closing through the opposing order block to validate a new protected swing.</li>\n<li><b>Entry:</b> on the protected-swing-confirming close, or a slight retest of the validated continuation order block.</li>\n<li><b>Stop:</b> on the new protected swing extreme.</li>\n<li><b>Target:</b> HTF objectives, PDH/PDL, or SD projections (−2 to −2.5 SD); a 2R minimum applies.</li>\n<li><b>Nuance:</b> true aggressive expansion needs all three timeframes aligned (Daily C3 + 4H C3 + 15m protected swing); and <b>never</b> take a continuation after a major HTF objective (PDH/PDL) is already hit — that triggers a new phase (consolidation/reversal).</li>\n</ul>"},{"id":"example","title":"Worked example","html":"\n<p>TTrades' highest-conviction framework: trading the <b>Candle 3 expansion simultaneously across timeframes</b>. The easiest, most aggressive expansions occur when Daily, 4H, and 15m all align in one direction.</p>\n<h3>Step 1 — the anchor (daily bias)</h3>\n<p>After the daily close: today's candle traded down, swept below the PDL into a daily FVG, then decisively closed back inside the previous day's range — a classic bullish <b>C2 closure</b>. The daily candle has a <i>small</i> lower wick, proving the reversal happened early and leaving range to expand tomorrow. Bias is locked: tomorrow we exclusively seek the bullish <b>C3 expansion body</b>, target = the easiest draw, the PDH.</p>\n<h3>Step 2 — structural alignment (4H)</h3>\n<p>The new day begins. We don't buy blindly off the open — \"let the wick form, then trade the body.\" Drop to the 4H: right off the open price dips to a shallow low then aggressively closes over the previous down-close candle, printing a bullish C2 reversal closure on the 4H. Timeframes aligned: Daily C3 + 4H C3. The HTF wick is locked in.</p>\n<h3>Step 3 — the trigger (15m IC-CISD)</h3>\n<p>Zoom to the 15m execution chart. Price dips to retest a 15m FVG in the lower half of the developing 4H candle (the T-Spot). We wait for the IC-CISD: identify the down-close candles that drove price into the local low; a 15m bullish candle then displaces and closes decisively <i>above their opening price</i>. That closure validates a continuation order block and converts the local low into a <b>protected swing</b>.</p>\n<h3>Step 4 — execution &amp; management</h3>\n<p>The moment the 15m IC-CISD candle closes, execute a market buy (or a limit on a slight retest of the new order block). Stop goes strictly under the new 15m protected-swing low — a close below it invalidates the whole top-down trend. With Daily/4H/15m aligned, the environment is primed for one-sided expansion: take a fixed 2R to secure gains and hold runners to the PDH. Price expands smoothly, hitting 2R and eventually sweeping the daily liquidity.</p>\n<p><b>Nuances:</b> (1) never front-run the IC-CISD — the top reason continuations fail is entering before price closes over the opposing down-close candles; sacrifice the absolute bottom for mechanical confirmation. (2) The IC-CISD must form <b>early</b> in the 4H candle's life; if it forms near the end of the window, skip and wait for the next 4H candle.</p>"},{"id":"nuances","title":"Nuances you must not miss","html":"\n<h3>Overcomplicating PD arrays (analysis paralysis)</h3>\n<p>Trying to spot every concept at once — FVGs, order blocks, breakers, OTEs, inversions — clutters the chart and prevents clean execution. <b>Nuance:</b> choose <i>one</i> PD array that makes visual sense to you (e.g. the CISD) and master it, combined with structural highs/lows, into a simple repeatable model.</p>\n<h3>Forcing trades on SMT divergence</h3>\n<p>Hunting an SMT and using it to blindly force an entry: SMT without displacement and a valid structural model means nothing. <b>Nuance:</b> SMT is strictly added <i>confluence</i> — find the structural framework (e.g. a CISD) first, then check for SMT. Beware \"fake SMTs\": if the stronger asset sweeps but fails to print a reversal signature and just consolidates, the divergence is fake and the laggard will catch up and sweep too.</p>\n<h3>Why continuations fail (the three traps)</h3>\n<ul>\n<li><b>Trap 1 — it's actually consolidation:</b> an ideal continuation is a swift V-shaped recovery that closes cleanly through the opposing order block; if it takes several sluggish candles (4+) to close through, it's consolidation, not continuation.</li>\n<li><b>Trap 2 — forming directly on short-term targets:</b> if the trigger forms exactly as price sweeps a short-term high/low, avoid it — the sweep often induces a reversal to hunt your stop; wait for a fresh continuation after the target clears.</li>\n<li><b>Trap 3 — trading after HTF objectives are hit:</b> never take a continuation after a major HTF objective (PDH/PDL) is swept — hitting a major draw exhausts the run and triggers a new phase.</li>\n</ul>\n<h3>Ignoring wick size on reversal days</h3>\n<p>Expecting massive expansion regardless of how the candle opened. <b>Nuance:</b> assess the opposing run (the wick) — a large wick means the candle already burned most of its range/time; pull targets back to the daily open or local liquidity. Aggressive one-sided trends only come from a <i>small</i> wick formed early.</p>\n<h3>Stop-loss greed</h3>\n<p>Placing the stop at the edge of the OB/FVG body to inflate R:R. <b>Nuance:</b> price often wicks deeper before expanding — anchor the stop at the actual protected-swing extreme; don't chase a 4R trade by putting the stop somewhere vulnerable.</p>\n<h3>Trading \"random\" swing points</h3>\n<p>Trading a CISD or order block blindly in the middle of the chart. <b>Nuance:</b> a structural pattern is invalid unless it occurs at an HTF POI — price must first tap an HTF FVG, sweep old external liquidity, or react at an established HTF level.</p>"},{"id":"grounding","title":"Grounding & sources","html":"\n<p>This guide is transcribed faithfully from TTrades' NotebookLM notebook (<code>2a6deaec…</code>), built from his YouTube channel <b>@TTrades_edu</b> (the Fractal Model / TTFM education). Every claim traces to a NotebookLM answer grounded in that corpus; the bracketed <code>[n]</code> citations in the underlying answers map to individual source videos. Nothing here is imported from outside the corpus.</p>"}]},{"id":"daye","name":"Daye","tagline":"owns TIMING — Quarterly Theory (AMDX quarters, True Opens, Sequential SMT)","sections":[{"id":"thesis","title":"Core thesis","html":"\n<p>Daye's core thesis is that algorithmic price delivery is governed entirely by <b>time</b>, not by price action — so you fractally divide time into quarters to remove ambiguity and anticipate precise turning points. In Quarterly Theory the market runs mechanically across all timeframes: <b>Q1</b> is a barometer (a consolidated Q1 dictates a Q2 expansion; an overextended Q1 dictates Q2 consolidation); the exact opening price of <b>Q2</b> is the static <b>True Open</b>, a rigid filter where you buy strictly <i>below</i> it in a bullish environment and sell <i>above</i> it in a bearish one to survive algorithmic \"Judas Swings\"; <b>Q3</b> is the true distribution phase; and <b>Q4</b> is designed for explosive reversals. The critical nuance: standard price arrays (FVGs, order blocks) are <i>illusions</i> until confirmed by <b>Sequential SMT</b> — a localized crack in correlation between three related assets (e.g. NQ, ES, YM) that must occur strictly between specific quarters (Q3→Q4, or Thursday→Friday) and physically below/above the cycle's True Open. So you abandon price-first logic, rely on multi-timeframe synchronization (a lower-timeframe setup anchored to a higher-timeframe Sequential SMT), and execute only when asset divergence aligns with the pre-programmed time quarters.</p>"},{"id":"model","title":"The market model","html":"\n<p>Quarterly Theory divides time mathematically into quarters for an unambiguous read of market cycles. The foundational principle is that <b>time is fractal</b> — algorithmic delivery repeats identically across macro and micro timeframes. Abandon a price-first mentality and align each time cycle with a specific chart timeframe.</p>\n<h3>Step 1 — the fractal time cycles (each on its own timeframe)</h3>\n<ul>\n<li><b>Yearly cycle:</b> four 3-month quarters (Q1 = Jan–Mar…) → analyze on the <b>Weekly</b> chart.</li>\n<li><b>Monthly cycle:</b> four 1-week quarters — start counting from the <b>first full week</b>, ignoring partial weeks as distortion → <b>Daily / 4H</b>.</li>\n<li><b>Weekly cycle:</b> four 1-day quarters — Monday (Q1), Tuesday (Q2), Wednesday (Q3), Thursday (Q4); <b>Friday is intentionally omitted</b> (it retraces the weekly range) → <b>4H / 1H</b>.</li>\n<li><b>Daily cycle:</b> four 6-hour sessions — Asian (Q1), London (Q2), New York (Q3), Afternoon (Q4) → <b>15m</b>.</li>\n<li><b>90-minute cycles:</b> each session subdivides into four 90-minute quarters → <b>5m</b>.</li>\n</ul>\n<h3>Step 2 — the four quarters (AMDX) and the defining range</h3>\n<p>The algorithm follows an <b>AMDX</b> profile — Accumulation, Manipulation, Distribution, X (reversal/continuation):</p>\n<ul>\n<li><b>Q1 (Accumulation / defining range):</b> the barometer — tight Q1 → Q2 expands; overextended Q1 → Q2 consolidates. <b>Omit the first third (T1) of Q1</b>; only use T2 and T3 to project the defining range.</li>\n<li><b>Q2 (Manipulation):</b> the fake move / \"Judas Swing\" engineered to get retail offside.</li>\n<li><b>Q3 (Distribution):</b> the easiest phase — trend established, the real move happens. The single best window is <b>9:00–10:30 AM ET = \"Q3 of Q3\"</b>.</li>\n<li><b>Q4 (Reversal or Continuation):</b> designed for explosive reversals; otherwise it continues the cycle.</li>\n</ul>\n<h3>Step 3 — True Opens and time-based premium/discount</h3>\n<p>The most important mechanic is the <b>True Open</b> = the exact opening price of <b>Q2</b> of any cycle. Static rule: <b>buy below the True Open in a bullish environment, sell above it in a bearish one.</b> For Q4 the opening price of the fourth quarter is a \"Revolving True Open\" (a secondary filter for Q4 reversals). The algorithm highly respects <b>Stacked True Opens</b> — a lower-timeframe True Open sitting just above/below a higher-timeframe one — creating premium/discount zones based on time, not price.</p>\n<h3>Step 4 — the ultimate nuance: Sequential SMT</h3>\n<p>FVGs, order blocks, and breakers are illusions that fail frequently unless activated by <b>Sequential SMT</b> — a crack in correlation among three related assets (S&amp;P, NASDAQ, Dow) that occurs strictly at the boundaries between specific quarters. Example: on the Q3→Q4 transition, if NASDAQ makes a lower low but the S&amp;P fails to, a bullish reversal is imminent. Without this time-based divergence occurring above/below a True Open, any price run is just low-probability liquidity engineering — so you wait for a higher-timeframe cycle to form Sequential SMT, a lower-timeframe cycle to confirm it, and only then enter.</p>"},{"id":"glossary","title":"Concept glossary","html":"\n<h3>Quarter</h3>\n<p>The division of a fractal time cycle into four equal algorithmic parts (Yearly 3 months → Monthly 1 week → Weekly 1 day → Daily 6 hours → 90-minute). <b>Nuance:</b> time is strictly fractal — the sequence repeats across macro and micro TFs; when charting the weekly cycle, <b>Friday is intentionally omitted</b> (it serves its own function, often just retracing the weekly range).</p>\n<h3>True Open</h3>\n<p>The static opening price of the <b>second quarter (Q2)</b> of any cycle. <b>Nuance:</b> it's the ultimate time-based filter for stop hunts — <b>buy below the True Open in a bullish environment, sell above it in a bearish one.</b></p>\n<p><b>Exact True Open times:</b></p>\n<ul>\n<li><b>True Year Open:</b> the open of the first Monday of April.</li>\n<li><b>True Month Open:</b> the open of the second Monday of the month.</li>\n<li><b>True Week Open:</b> Monday 6:00 PM.</li>\n<li><b>True Day Open:</b> 12:00 AM (midnight).</li>\n<li><b>Asian session (Q1 90m) True Open:</b> 7:30 PM.</li>\n<li><b>London session (Q2 90m) True Open:</b> 1:30 AM.</li>\n<li><b>New York session (Q3 90m) True Open:</b> 7:30 AM.</li>\n<li><b>Afternoon session (Q4 90m) True Open:</b> 1:30 PM.</li>\n</ul>\n<h3>Dealing Range (the defining range)</h3>\n<p>The Q1 accumulation range that acts as the algorithmic input/barometer for the cycle. <b>Nuance:</b> divide Q1 into thirds and <b>omit the first third (T1) entirely</b>; use only T2 and T3 to define the range, then project one standard deviation to forecast the session's highs/lows.</p>\n<h3>AMDX</h3>\n<p>The instruction set across four quarters: Accumulation, Manipulation, Distribution, X (continuation/reversal). <b>Nuance:</b> the algorithm can also run an inverted <b>X-AMD</b> (Q1 = continuation/reversal, Q2 = accumulation, Q3 = manipulation, Q4 = distribution) — but even if accumulation happens in Q2, the True Open rule stays static: the Q2 opening price is <i>always</i> the True Open.</p>\n<h3>Q1 / Q2 / Q3 / Q4</h3>\n<p><b>Q1</b> accumulation/barometer (tight Q1 → Q2 expands; overextended Q1 → Q2 consolidates; its opening gap is dynamic S/R). <b>Q2</b> manipulation, contains the True Open — engineered fake moves. <b>Q3</b> distribution, the easiest phase to trade. <b>Q4</b> reversal — the single highest-probability trade when paired with Sequential SMT.</p>\n<h3>Premium / Discount</h3>\n<p>Mathematically favorable zones for buys (discount) or sells (premium). Beyond the price-based 50% equilibrium, QT specializes in <b>time-based</b> premium/discount. <b>Nuance:</b> the most precise setups rely on Stacked True Opens — in a bearish market, \"premium\" is price above a lower-TF True Open already stacked above a higher-TF one; in a bullish market, \"discount\" is price below a lower-TF True Open below a higher-TF one.</p>\n<h3>Judas Swing</h3>\n<p>The manipulation / fake move engineered to get retail offside before the real run. <b>Nuance:</b> it shows up most often in Q2 (or Q3 in an X-AMD cycle) and is gauged exclusively via the True Open — any \"breakout\" is a Judas Swing until it breaches the True Open boundary.</p>\n<h3>SMT (Sequential SMT Divergence)</h3>\n<p>A localized crack in correlation between three related assets (S&amp;P, NASDAQ, Dow) — one makes a lower low / higher high, the others fail to. <b>Nuance:</b> standard SMT is useless and dangerous; it only becomes valid <b>Sequential</b> SMT when the divergence occurs strictly at the transition between distinct quarters (Q1→Q2, Q3→Q4). A higher-TF Sequential SMT needs a lower-TF Sequential SMT to confirm it. Without time-quarter synchronization, an SMT is just engineered liquidity waiting to be run over.</p>"},{"id":"timing","title":"Timing & sessions","html":"\n<p>Price delivery is governed by time. Dividing the 24-hour day into fractal quarters tells you exactly <i>when</i> the market is engineered to manipulate, distribute, and reverse.</p>\n<h3>The daily Q1–Q4 cycle (6-hour quarters, on the 15m chart)</h3>\n<ul>\n<li><b>Q1 — Asian (6:00 PM–12:00 AM): Accumulation.</b> The barometer. Omit T1; use T2/T3 to project the defining range. Tight Asia → London expands; overextended Asia → London consolidates.</li>\n<li><b>Q2 — London (12:00 AM–6:00 AM): Manipulation.</b> Contains the True Day Open — the window engineered to create the Judas Swing.</li>\n<li><b>Q3 — New York (6:00 AM–12:00 PM): Distribution.</b> The easiest phase — orders were accumulated in Asia and early traders manipulated in London; NY distributes in the true direction.</li>\n<li><b>Q4 — Afternoon (12:00 PM–6:00 PM): Reversal (or Continuation).</b> Famous for reversals, especially exploitable with a Q3→Q4 Sequential SMT.</li>\n</ul>\n<h3>90-minute cycles &amp; exact True Opens (on the 5m chart)</h3>\n<p>Each session subdivides into four 90-minute quarters; the True Open is always the Q2 open. Quarter boundaries: Asian — Q1 6:00–7:30 PM, <b>True Open 7:30 PM</b>, Q3 9:00–10:30 PM, Q4 10:30 PM–12:00 AM. London — Q1 12:00–1:30 AM, <b>True Open 1:30 AM</b>, Q3 3:00–4:30 AM, Q4 4:30–6:00 AM. New York — Q1 6:00–7:30 AM, <b>True Open 7:30 AM</b>, Q3 9:00–10:30 AM, Q4 10:30 AM–12:00 PM. Afternoon — Q1 12:00–1:30 PM, <b>True Open 1:30 PM</b>, Q3 3:00–4:30 PM, Q4 4:30–6:00 PM. (Because the day begins at 6:00 PM, the day's Q2 begins at midnight → the <b>True Day Open is 12:00 AM</b>.)</p>\n<h3>The \"Q3-of-Q3\" sweet spot</h3>\n<p>If you trade one window, trade <b>9:00–10:30 AM EST</b> — Daye notes ~70% of the time the day's best setup forms here. Why: the NY session is Q3 of the daily cycle, and 9:00–10:30 is Q3 of the NY session's 90-minute cycle → <b>Q3 of Q3</b>, aligning the distribution phase of the daily cycle with the distribution phase of the session cycle for the cleanest directional move. Wait for an 8:30 AM news release to create the Judas Swing, then enter in the 9:00–10:30 window once Sequential SMT confirms.</p>"},{"id":"setups","title":"Signature setups, step-by-step","html":"\n<h3>1. Q1 Asian Dynamic S/R</h3>\n<ul>\n<li><b>Context:</b> the Asian session (6:00 PM–12:00 AM ET) = Q1 of the daily cycle, the barometer.</li>\n<li><b>Trigger:</b> divide Q1 into thirds, let T1 pass; price pulls back into the Q1 opening price/gap during T2 or T3.</li>\n<li><b>Entry:</b> where the Q1 opening gap overlaps a fair value gap — a highly reactive dynamic S/R.</li>\n<li><b>Stop:</b> below the swing low that taps the Q1 opening gap.</li>\n<li><b>Target:</b> project 1 standard deviation from the T2–T3 defined range to forecast the session high/low.</li>\n<li><b>Nuance:</b> entirely ignore T1's price action — only T2/T3 project the defining range.</li>\n</ul>\n<h3>2. Daily Q2 London Stop Hunt</h3>\n<ul>\n<li><b>Context:</b> the London session (12:00 AM–6:00 AM ET) = Q2, engineered for the Judas Swing.</li>\n<li><b>Trigger:</b> price trades lower, sweeping the Asian (Q1) lows to engineer sell-side liquidity, but forms Sequential SMT against a correlated asset.</li>\n<li><b>Entry:</b> only when price is physically <i>below</i> the True Day Open (12:00 AM) AND the London 90m True Open (1:30 AM), with an LTF FVG or precision swing point.</li>\n<li><b>Stop:</b> below the lowest wick of the London manipulation low.</li>\n<li><b>Target:</b> the buy-side liquidity above the Asian highs.</li>\n<li><b>Nuance:</b> this relies on <b>Stacked True Opens</b> — buying below the 1:30 AM True Open when it's already below the 12:00 AM True Day Open is a high-probability time-based discount.</li>\n</ul>\n<h3>3. Q3-of-Q3 \"Sweet Spot\"</h3>\n<ul>\n<li><b>Context:</b> 9:00–10:30 AM EST — Q3 of the NY 90m cycle, itself Q3 of the daily cycle, aligning macro and micro distribution.</li>\n<li><b>Trigger:</b> after the 8:30 AM news manipulation, Sequential SMT forms between assets (e.g. NQ lower low, ES higher low) strictly within 9:00–10:30.</li>\n<li><b>Entry:</b> on an FVG or order block forming right after the SMT; for longs this must happen <i>below</i> the 7:30 AM NY True Open.</li>\n<li><b>Stop:</b> anchor a fib from the manipulation swing high to low; place the stop at the 1 SD projection.</li>\n<li><b>Target:</b> external range liquidity (old highs/lows) or the opposite side of the daily dealing range.</li>\n<li><b>Nuance:</b> if bullish Sequential SMT forms <i>above</i> the True Open, <b>ignore it</b> — it's engineered liquidity, not a valid divergence; it's only valid below the True Open (for longs).</li>\n</ul>\n<h3>4. Q4 Afternoon Reversal</h3>\n<ul>\n<li><b>Context:</b> the Afternoon session (12:00 PM–6:00 PM ET) = Q4, programmed for explosive reversals.</li>\n<li><b>Trigger:</b> Q3 (NY) expands aggressively; into Q4 price trades above the 1:30 PM Revolving True Open but fails to break the Q3 high, while a correlated asset breaks its Q3 high.</li>\n<li><b>Entry:</b> short as price breaks back below the 1:30 PM Revolving True Open, ideally overlapping an imbalance or precision swing point.</li>\n<li><b>Stop:</b> just above the newly formed SMT swing high.</li>\n<li><b>Target:</b> the initial swing low after the SMT, or the 50% equilibrium of the day's dealing range.</li>\n<li><b>Nuance:</b> always trade the <b>weaker asset</b> — the one that failed to run its Q3 high; it falls harder and faster on the reversal. And if there was no cracking correlation earlier (Q1/Q2 or Q2/Q3), stop trading entirely after 4:30 PM EST.</li>\n</ul>"},{"id":"example","title":"Worked example","html":"\n<p>Daye's ultimate \"one-shot, one-kill\" — the <b>Q3-of-Q3 Wednesday reversal</b>, combining macro fractal alignment, time filters, and algorithmic divergence.</p>\n<h3>Step 1 — macro alignment (before 9:00 AM EST)</h3>\n<p>It's Wednesday = Q3 of the weekly cycle. You're waiting for the New York session = Q3 of the daily cycle, on the 5m chart (mandatory for 90-minute cycles). You aim for the sweet spot 9:00–10:30 AM EST = Q3 of the NY session — trading the distribution phase of the distribution phase, on the weekly distribution phase. <b>Nuance:</b> before 9:00, draw a hard line at the 7:30 AM open (the NY True Open). Bias is bullish, so you're forbidden from buying unless price is trading <i>below</i> that 7:30 level.</p>\n<h3>Step 2 — the Judas swing &amp; Sequential SMT (9:00–9:30)</h3>\n<p>At 9:00 price is dropping below the 7:30 True Open into a heavy discount. Watching NQ, ES, YM side-by-side: NASDAQ drops violently, sweeping below the London low — retail shorts the breakout. But ES fails to take out its own London low: a failure swing. <b>Nuance:</b> because this crack happened <i>below</i> the True Open, in the 9:00–10:30 window, it's confirmed Sequential SMT. Had the same divergence formed <i>above</i> the True Open, you'd ignore it as fake liquidity.</p>\n<h3>Step 3 — entry trigger (9:30–9:45)</h3>\n<p>Price reverses up, shifting structure. You wait for a down-closed candle (order block) paired with an FVG (or a Balanced Price Range = two overlapping FVGs). Pull a fib from the SMT swing low to the new high; verify the FVG sits in the lower half (discount). Place a buy limit at the OB+FVG overlap.</p>\n<h3>Step 4 — risk &amp; stop</h3>\n<p>Use standard-deviation math, not a random stop: anchor a fib to the manipulation swing high and low, project 1 SD downward, and place the hard stop exactly there. If hit, the thesis is invalidated.</p>\n<h3>Step 5 — targets &amp; management (10:00–10:30)</h3>\n<p>Price taps the FVG below the True Open and explodes higher — in a confirmed Q3 distribution it aggressively seeks external liquidity. Target obvious diagonal-trendline highs (clean buy-side pools engineered earlier to trap sellers). As price runs, the new gaps left behind are likely unfilled \"breakaway gaps\"; trail the stop behind them until price smashes through the buy-side target.</p>"},{"id":"nuances","title":"Nuances you must not miss","html":"\n<h3>1. The \"fake SMT\" and True-Open invalidation</h3>\n<p>Trading any crack in correlation just because you see it is the most common mistake. A bullish Sequential SMT <i>above</i> a True Open is not real — ignore it; it must occur strictly below the True Open for longs (above for shorts). The algorithm often creates a fake Sequential SMT first to run stops, then the real one after — wait for the correct quarter transition.</p>\n<h3>2. The Magneto effect &amp; SMT cancellation</h3>\n<p>Sequential SMTs aren't permanent — a second SMT instantly cancels the first. If you're long on a bullish SMT and a bearish SMT forms between the current quarters, your thesis is invalidated; exit. Nuance: if a bullish and a bearish Sequential SMT occur in the same cycle, the <i>first</i> becomes a high-probability \"magnet\" — price is drawn back to that first SMT's liquidity pool to resolve delivery.</p>\n<h3>3. Asset selection — the \"weakest link\" rule</h3>\n<p>Don't trade the asset that broke the high/low to cause the SMT. Always execute on the <b>weakest</b> asset — the one that <i>failed</i> to make the lower low / higher high — it harbors the true pressure and moves harder and faster once the reversal triggers.</p>\n<h3>4. The illusion of PD arrays (order blocks &amp; breakers)</h3>\n<p>Coming from ICT, you'll fail by blindly trading order blocks/breakers — Daye says they don't work without imbalances. True HTF triggers, ordered by importance: Balanced Price Ranges (two overlapping FVGs) first, standard FVGs second, old liquidity pools third. Also: <b>wicks are gaps</b> — a Precision Swing Point's wick acts exactly like an FVG and is highly reactive.</p>\n<h3>5. Time distortion &amp; \"blank canvas\" days</h3>\n<p>Never trade Mondays with no high-impact news (chop or one-sided expansion with no safe entry); don't trade the day after a bank holiday; avoid trading before NFP/CPI. The first week of the month (NFP week) is deliberate \"time distortion\" — a low-probability environment of fake moves; the cleanest action is held back to the second and third weeks.</p>\n<h3>6. The 4:30 PM cut-off</h3>\n<p>If there was no clear cracking correlation / Sequential SMT earlier in the day (Q1/Q2 or Q2/Q3), stop trading — don't force a trade after 4:30 PM EST. If the signatures haven't appeared by then, the day's delivery is over and you're just gambling.</p>\n<h3>7. Timeframe desynchronization</h3>\n<p>Timeframes are rigidly paired to cycles — Monthly → Daily/4H, Weekly → 1H/4H, Daily → 15m, 90-minute quarters → strictly the 5m. Mixing these up destroys your accuracy.</p>"},{"id":"grounding","title":"Grounding & sources","html":"\n<p>This guide is transcribed faithfully from Daye's NotebookLM notebook (<code>3f9d9752…</code>), built from his YouTube channel <b>@QuaterlytheoryDaye</b> (Quarterly Theory). Every claim — including the exact True Open times — traces to a NotebookLM answer grounded in that corpus; the bracketed <code>[n]</code> citations in the underlying answers map to individual source videos. Nothing here is imported from outside the corpus.</p>"}]},{"id":"gxt","name":"GxT","tagline":"owns ENTRY — the Universal Sequence (IRL→ERL), 2-stage PSP/CISD, SMT triad","sections":[{"id":"thesis","title":"Core thesis","html":"\n<p>GxT's core thesis: the market mechanically moves from <b>Internal Range Liquidity (IRL)</b> to <b>External Range Liquidity (ERL)</b> and back, driven by the synchronized expansion of correlated asset triads aligning within higher-timeframe candle profiles. The <b>Universal Sequence</b> is the roadmap: price engages a key HTF level, prints a sharp <b>V-shape</b> reversal confirmed by a lower-timeframe Change in State of Delivery (CSD), and aggressively expands — leaving behind a new gap while engineering low-resistance equal highs/lows (failure swings). Rather than chasing the initial reversal, you wait for price to retrace into that newly formed gap and anticipate an SMT divergence within it (an \"SMT fill\"). Crucially, the sequence must be validated by a \"strength switch\" via a <b>Precision Swing Point (PSP)</b> — the previously lagging/weaker asset in the triad momentarily closes stronger to re-sync the correlated markets. Once that strength switch forms in the gap — ideally paired with an economic news driver to inject expansion volatility — you execute toward the opposing low-resistance liquidity, aligning with the 4H true-expansion phase rather than getting stopped in a manipulation wick.</p>"},{"id":"model","title":"The market model","html":"\n<p>The GxT model treats markets as mechanical: price moves A→B via Universal Models — <b>Internal→External (IRL→ERL)</b>, <b>External→Internal (ERL→IRL)</b>, and <b>Order Pairing Ranges</b>. The market can't reverse without a swing point, and can't reverse without an SMT divergence. The goal is to wait for the market to decouple, filter out the fake setups, and catch the true expansion by aligning the HTF draw on liquidity with LTF exact triggers.</p>\n<h3>Part 1 — the SMT triad (NQ / ES / YM)</h3>\n<ul>\n<li><b>Roles:</b> in indices, NQ is typically strongest, YM weakest, ES the middle asset.</li>\n<li><b>Decoupling:</b> never trade the middle asset when markets expand in opposite directions.</li>\n<li><b>Filtering fake SMTs:</b> SMTs form at every reversal/retracement — use the \"Advanced Premium/Discount\" filter: if an SMT forms while all assets expand and the lagging asset forms a failure swing in the <i>premium</i> (too close to target), it's low-probability and will break.</li>\n<li><b>The lagging asset:</b> if the leading asset hits the draw first, fails to manipulate it, and consolidates, don't trade the leader — trade the lagging asset (e.g. YM) to catch up to the same draw.</li>\n</ul>\n<h3>Part 2 — the Universal Sequence (IRL → ERL)</h3>\n<p>GxT's highest-probability continuation sequence, defining how price moves from a gap (IRL) to a target (ERL):</p>\n<ol>\n<li><b>Initial reversal:</b> price hits a key HTF level and reverses, confirmed by aggressive expansion away from it.</li>\n<li><b>Creation of the gap (IRL):</b> that expansion leaves a new fair value gap (a 3-candle sequence where candle 1's high and candle 3's low don't meet).</li>\n<li><b>Engineering liquidity (ERL):</b> as price retraces into the gap, it leaves failure swings (relatively equal highs/lows) — low-resistance liquidity for the target.</li>\n<li><b>The SMT fill:</b> price retraces into the gap — you want one asset to trade into the gap while the correlated asset does NOT (an \"SMT fill\").</li>\n<li><b>The target:</b> once the SMT fill is confirmed, price expands out of the gap (IRL) to sweep the failure swings (ERL).</li>\n</ol>\n<h3>Part 3 — execution triggers: 2-stage PSP &amp; CSD</h3>\n<ul>\n<li><b>Stage 1 — SMT with the key level:</b> the SMT fill itself (e.g. YM hits the gap, NQ does not).</li>\n<li><b>Stage 2 — the Precision Swing Point (PSP):</b> a swing point with an SMT built into its candle closures — as the assets form their \"candle 2\" reversal, they close in opposing directions (ES bullish while YM bearish).</li>\n<li><b>The ultimate nuance — Strength Switch PSP:</b> GxT's most powerful trigger. To validate the 2-stage SMT, the previously lagging/weaker asset must momentarily switch strength — if YM was making the lower lows (weaker), the PSP must show YM closing <i>bullish</i> while the stronger assets close <i>bearish</i>, proving the laggard is catching up to re-sync the market.</li>\n<li><b>The CSD (V-shape signature):</b> on the LTF (5m/3m), entry requires a \"V-shape\" — aggressive expansion <i>into</i> the key level immediately followed by aggressive expansion <i>away</i>, confirmed by a CSD, guaranteeing alignment with true expansion.</li>\n</ul>\n<p><b>The perfect trade:</b> identify an open draw on liquidity → wait for an initial reversal to create a gap → let price retrace into the gap leaving equal highs/lows → wait for an <b>SMT fill</b> inside the gap → confirm with a <b>Strength Switch PSP</b> → execute on the LTF <b>V-shape CSD</b> → target the engineered failure swings.</p>"},{"id":"glossary","title":"Concept glossary","html":"\n<h3>IRL — Internal Range Liquidity</h3>\n<p>Fair value gaps located within a previously established range. <b>Nuance:</b> IRL is your key level for framing continuations — to force a small-wick HTF expansion candle, look for an IRL gap specifically in the upper half of the previous bullish candle's range.</p>\n<h3>ERL — External Range Liquidity</h3>\n<p>The extremes of a range — relevant swing highs/lows, previous session or daily highs/lows. <b>Nuance:</b> ERL is your draw on liquidity (target); the highest-probability ERL targets are \"failure swings\" (relatively equal highs/lows) engineered during a retracement. If price manipulates ERL without displacing through it, it triggers a reversal model (External→Internal).</p>\n<h3>PSP — Precision Swing Point</h3>\n<p>A swing point that contains a built-in SMT within the candle closures themselves (candle 2 creates a swing but closes bullish on one asset, bearish on a correlated one). <b>Nuance:</b> the \"Strength Switch PSP\" is the most powerful variant — the strongest asset (which ran the high) closes bearish while the lagging asset (which failed to run it) closes bullish, signaling you should enter the lagging asset to target the same high.</p>\n<h3>CISD / CSD — Change in State of Delivery</h3>\n<p>An LTF reversal signature confirming an HTF key level has been defended and rejected. <b>Nuance:</b> a true CSD must show a sharp <b>V-shape</b> — aggressive expansion into the level then immediately away from it; without that displacement, the level is likely just consolidating and the reversal is low-probability.</p>\n<h3>SMT Triad</h3>\n<p>Three tightly correlated markets viewed together to filter fakes and identify true reversals — for indices NQ/ES/YM; for gold XAUUSD/XAUEUR/XAUGBP (18:00 open feeds). <b>Nuance:</b> NQ and YM are the strong/weak extremes, ES the middle; when decoupled (expanding opposite directions) never trade the middle asset — wait for the lagging extreme to form an SMT and switch strength to re-sync the triad.</p>\n<h3>Universal Sequence / Model</h3>\n<p>The mechanical roadmap for A→B using three frameworks: Internal→External, External→Internal, and Order Pairing Ranges. <b>Nuance:</b> the highest-probability sequence uses gaps for continuation — reverse at a key level → expand to create a gap → retrace into it leaving engineered equal highs/lows → form an SMT divergence <i>inside</i> the gap (an \"SMT fill\") → expand to the equal highs/lows.</p>\n<h3>Candle Profiling</h3>\n<p>Using the OHLC and wick size of HTF candles (4H/Daily/Weekly) to predict whether a day expands or chops. <b>Nuance:</b> wick size is the ultimate dictator — a bullish expansion day <i>must</i> open low first, creating a small wick; if it opens high and drops deep to create a massive manipulation wick, it eats too much time/range and physically can't expand far past the daily open (adjust targets to the daily open / inside the range).</p>\n<h3>Driver</h3>\n<p>High-impact economic news (8:30 AM news, 9:30 AM NYSE open) that injects volume and timing volatility. <b>Nuance:</b> use \"Driver Pairing\" — if a reversal swing point is already established before the driver, the driver just expands away from it; if no high/low of the day exists yet, the driver's job is to spike into a key level, manipulate it, and create the reversal.</p>\n<h3>LTF FVG</h3>\n<p>A three-candle gap on lower timeframes (15m/5m/3m) where candle 1's high and candle 3's low don't overlap. <b>Nuance:</b> don't trade just any gap — gaps are strictly for <i>continuation</i> after a true reversal; the highest-probability gaps are \"SMT fills\" where the lagging asset trades into the LTF gap but the leading asset fails to reach its respective gap.</p>"},{"id":"timing","title":"Timing & sessions","html":"\n<p>GxT's approach is rooted in <b>4H profiling</b> — the 4-hour candle opens for indices/futures at <b>2:00 AM, 6:00 AM, 10:00 AM, and 14:00 ET</b>. He uses a strict \"If/Then\" sequence: <i>if 2 AM manipulates, 6 AM should continue; if 6 AM manipulates, 10 AM should continue; if 10 AM manipulates, 14:00 should continue.</i></p>\n<h3>London (2:00 AM ET)</h3>\n<p>The 2:00 AM 4H candle dictates London (killzone 2:00–5:00 AM). Its job is often to manipulate into an HTF key level to form the true high/low of the day; if it prints a small-wick reversal, it sets NY up to simply expand. GxT rarely trades London directly but religiously uses its close to frame the NY bias.</p>\n<h3>6:00 AM ET (NY AM) — the favorite reversal window</h3>\n<p>Covers 6:00–10:00 AM (killzone 8:00–10:00 AM). GxT's highest-probability <b>reversal</b> window because it contains the most volatile drivers — 8:30 news and the 9:30 equities open. With \"driver pairing\": if no high/low of the day exists yet, wait for the drivers to spike into a key level, manipulate it, and create a sharp V-shape reversal. If 2:00 AM London already set the low, the 6:00 candle just finds support and expands away.</p>\n<h3>10:00 AM ET (NY AM → Lunch)</h3>\n<p>Covers 10:00 AM–12:00 PM. GxT vastly prefers a <b>10:00 continuation</b> over a reversal: if the 6:00 candle used the 8:30/9:30 drivers to reverse, the 10:00 candle opens low (bullish) and expands to the session highs. <b>Nuance:</b> a 10:00 reversal is a red flag — if the 8:30/9:30 drivers hit a key level but failed to reverse, the bias is wrong; the only high-probability 10:00 reversal is when a massive one-sided expansion hits a daily level <i>late</i>, the daily wick has grown too large, and range is exhausted → trade a counter-trend reversal back into the range.</p>\n<h3>14:00 / 2:00 PM ET (NY PM)</h3>\n<p>The afternoon continuation. If the 10:00 candle spent its time retracing/engineering liquidity, the 14:00 candle continues the daily expansion into the close. Strictly alignment-based — GxT won't trade PM continuations if the daily profile is exhausted or the morning already expanded into the true draw.</p>"},{"id":"setups","title":"Signature setups, step-by-step","html":"\n<h3>1. 6:00 AM NY Reversal → 10:00 AM Continuation</h3>\n<ul>\n<li><b>Context:</b> the 6:00 AM 4H candle is the ideal reversal window (contains the 8:30 &amp; 9:30 drivers); its job is to manipulate into a key level and set the day's true high/low, leaving 10:00 to expand.</li>\n<li><b>Trigger:</b> the 6:00 candle prints a reversal swing point / V-shape CSD before 10:00.</li>\n<li><b>Entry:</b> at/shortly after the 10:00 open — price retraces to form the wick, finding support at an opposing bulky candle, breaker, or FVG left by the 6:00 expansion.</li>\n<li><b>Stop:</b> at the EQ of the previous 1H/4H range, or below the bulky opposing candle/gap supporting the 10:00 open.</li>\n<li><b>Target:</b> unestablished session highs, ERL, or the opposing daily draw.</li>\n<li><b>Nuance:</b> GxT vastly prefers 10:00 continuations over reversals — if the 6:00 drivers failed to reverse at a key level, don't trust 10:00 to randomly reverse; that failure invalidates the reversal profile.</li>\n</ul>\n<h3>2. NY AM V-Shape Reversal</h3>\n<ul>\n<li><b>Context:</b> price engages a relevant HTF key level (hourly/4H FVG or a protected swing low) in NY AM.</li>\n<li><b>Trigger:</b> aggressive expansion <i>into</i> the level immediately followed by sharp expansion <i>away</i> — a distinct V-shape, confirmed by a CSD on the 1m/3m/5m.</li>\n<li><b>Entry:</b> on the CSD closure, or on the immediate retrace into the new gap (the SMT fill) left by the V-shape.</li>\n<li><b>Stop:</b> tightly below the absolute extreme (the wick) of the V-shape manipulation.</li>\n<li><b>Target:</b> low-resistance failure swings on the opposing side, or the next ERL.</li>\n<li><b>Nuance:</b> you must see the aggressive V-shape displacement <i>away</i> from the level — if price hits it and chops/consolidates, it's not a true reversal (likely seek-and-destroy or a continuation).</li>\n</ul>\n<h3>3. Driver Pairing</h3>\n<ul>\n<li><b>Context:</b> approaching a high-volatility driver (8:30 news / 9:30 open); the setup depends on whether a reversal is already established.</li>\n<li><b>Trigger:</b> if no daily high/low exists yet → the driver spikes into a key level, manipulates it, and creates the reversal; if a reversal is already in → the driver simply opens and expands away from the key level.</li>\n<li><b>Entry:</b> a positional limit at a bulky opposing candle right before the driver (anticipating pure expansion), or immediately after the driver forms its 1m/3m V-shape CSD.</li>\n<li><b>Stop:</b> behind the order block or FVG the driver is expanding away from.</li>\n<li><b>Target:</b> unestablished session highs, PDH/PDL, or failure swings — drivers \"knife\" through low-resistance liquidity.</li>\n<li><b>Nuance:</b> if a low of the day is established and price retraces into a key level right before the driver, the driver <i>must</i> expand away; if it hits the level and fails to reverse/expand, the bias is wrong.</li>\n</ul>\n<h3>4. Lagging-Asset SMT (Asset Synchronization)</h3>\n<ul>\n<li><b>Context:</b> viewing the correlated triad (NQ/ES/YM); the leading (strongest) asset hits the ERL draw first.</li>\n<li><b>Trigger:</b> the leader fails to manipulate the high and consolidates/retraces slightly, while the lagging asset (not yet at the draw) forms a <b>Strength Switch PSP</b> — momentarily closing stronger (bullish) while the leader closes bearish.</li>\n<li><b>Entry:</b> the lagging/weakest asset immediately after the strength-switch PSP closure or an SMT fill inside a gap.</li>\n<li><b>Stop:</b> below the low of the strength-switch PSP or the SMT gap.</li>\n<li><b>Target:</b> the exact same high/low draw the leading asset already hit.</li>\n<li><b>Nuance:</b> mechanically filter fake SMTs with Advanced Premium/Discount — if an SMT forms while all assets expand the same direction and the laggard prints its failure swing in the <i>premium</i> (too close to target), it's low-probability and will break.</li>\n</ul>"},{"id":"example","title":"Worked example","html":"\n<p>GxT's \"Holy Grail\": the <b>Universal Sequence + Strength Switch SMT fill, paired with a NY driver</b>, on the NQ/ES/YM triad.</p>\n<h3>Phase 1 — framing the narrative (6:00–8:30 AM ET)</h3>\n<p>The daily candle opened low first, forming a small wick → supports a bullish expansion day. In the 6:00 AM 4H window, price sweeps a relevant prior-day swing low and immediately prints an aggressive V-shape displacement up. That confirms the low of the day is likely in, and leaves behind a massive 1H FVG (our IRL). As price expands, it forms relative equal highs (failure swings) — engineered low-resistance ERL above.</p>\n<h3>Phase 2 — the retracement &amp; decoupling (8:30–9:15 AM)</h3>\n<p>We don't chase — after equal highs, price retraces into the new gap. Splitting the screen across NQ/ES/YM: NQ (strongest) stops retracing early and consolidates high, failing to reach its lower gap; YM (weakest) plunges into our 1H FVG. YM hits the gap, NQ doesn't → an <b>SMT fill</b>.</p>\n<h3>Phase 3 — the trigger (9:15–9:25 AM)</h3>\n<p>Drop to the 15m inside the gap and wait for the <b>Strength Switch PSP</b>. YM looks weakest (dropped furthest to hit the gap), but as the 15m candle closes, NQ prints a <i>bearish</i> close while YM prints a <i>bullish</i> close — YM has momentarily switched to strongest to catch up. This two-stage strength switch inside the gap says the retracement is over and all assets are about to sync and expand.</p>\n<h3>Phase 4 — execution (9:30 AM equities open)</h3>\n<p>Pair with the driver. Because the true reversal (SMT fill + PSP) was already in before the 9:30 bell, the driver's only job is to expand away from the gap. Drop to the 3m/5m: at 9:30 price dips into the bulky opposing gap candles for support then violently displaces up. The moment the 3m candle closes above the opposing down-candles (LTF CSD), market-execute long on YM (the lagging asset).</p>\n<h3>Phase 5 — management &amp; targets</h3>\n<p>Don't stop tightly at the 3m CSD base (drivers are volatile) — place the stop below the extreme wick of the 1H FVG (HTF protection). Target the engineered equal highs (ERL). In a true expansion phase price knifes through the low-resistance liquidity: take 50% partial at 2R, move to break-even once a new LTF gap forms, and let the runner hit the session highs. <b>Nuance:</b> run Advanced Premium/Discount on the leader first — if NQ had already hit a major draw / swept a daily high before the retrace, the bullish SMT is likely fake; the setup only works because NQ <i>failed</i> to hit the true draw, guaranteeing the laggard must catch up.</p>"},{"id":"nuances","title":"Nuances you must not miss","html":"\n<h3>1. The \"fake SMT\" trap</h3>\n<p>Using an indicator to spot any SMT and blindly trading it — SMTs form at <i>every</i> retracement and reversal. Beware \"Failure Swing SMTs\": if all triad assets expand the same direction and the laggard creates an SMT in the <b>premium</b> (too close to the draw), it's fake and will break. To filter, you must see <b>displacement (a V-shape) away from the SMT</b>; if the asset that sweeps the high/low just consolidates/inside-bars, it's a continuation signature and the SMT fails.</p>\n<h3>2. Chasing price in Candle 3 (entering too late)</h3>\n<p>Entering continuations at the absolute extremes of a fully expanded range gets you caught in new phases (deep retracements/consolidations). The fix: wait for a 15m/30m FVG to form within the expansion leg, let price retrace into it to form the new swing point — this protects you from chasing and gives a mechanical stop.</p>\n<h3>3. Ignoring candle profiling &amp; wick mathematics</h3>\n<p>Expecting big continuation when the daily candle already formed a giant manipulation wick, or getting chopped in \"seek and destroy\" profiles. A massive wick physically prevents a candle from expanding far past its open — on a large-wick reversal, adjust targets conservatively to the daily open / EQ / inside the range. If a daily candle opens high then opens low (manipulating both sides), it's a seek-and-destroy consolidation — don't trade it.</p>\n<h3>4. Trading the middle asset in decoupled markets</h3>\n<p>When indices decouple (NQ screaming up while YM plunges), ES is \"fighting for its life\" chopping in the middle. Never trade the middle asset in a decoupled market — wait for a manipulation or strength switch on the extremes to re-sync the triad, then trade the lagging extreme to catch up.</p>\n<h3>5. Driver invalidations &amp; \"random time\" reversals</h3>\n<p>Don't assume a 10:00 AM or 12:00 PM reversal when the 8:30/9:30 drivers failed to reverse. If price hits a major key level at the driver, the driver's job is to create the reversal — if it fails, the bias is wrong and the profile is invalidated. The only high-probability 10:00 reversal is when the drivers expanded into an objective very late, exhausting the daily range.</p>\n<h3>6. Framing reversals off failure swings</h3>\n<p>Never call a top/bottom off a failure swing (a high/low grouped close to many others) — if you manipulate a failure swing you just create another, giving price a reason to return and stop you out. Wait for price to manipulate a <b>relevant swing</b> (distinctly spaced out), which clears local liquidity and leaves no reason for price to return, allowing true expansion.</p>"},{"id":"grounding","title":"Grounding & sources","html":"\n<p>This guide is transcribed faithfully from GxT's NotebookLM notebook (<code>d34cdc19…</code>), built from his YouTube channel <b>@GxTradez</b> (the Universal Sequence / SMT-triad methodology). Every claim traces to a NotebookLM answer grounded in that corpus; the bracketed <code>[n]</code> citations in the underlying answers map to individual source videos. Nothing here is imported from outside the corpus.</p>"}]},{"id":"ict","name":"ICT","tagline":"the SUBSTRATE — PD arrays, liquidity, killzones, OTE, Power-of-3 (teaching core)","sections":[{"id":"thesis","title":"Core thesis","html":"\n<p class='nc'>This guide covers ICT's teaching core — the vocabulary the other four mentors build on — not the full 600+ lecture archive.</p>\n<p>ICT's core thesis: market movements are not driven by buying and selling pressure but by a precise, <b>time-based algorithm</b> engineered to seek liquidity and rebalance inefficiency. On a strict \"time first, then price\" protocol, the price engine perpetually cycles between sweeping <b>external range liquidity</b> (the buy/sell stops resting above old highs / below old lows) and returning to <b>internal range liquidity</b> (FVGs and order blocks) to rebalance the displacement caused by those stop runs. This creates a continuous price-delivery continuum: the algorithm traps retail on the wrong side of false breakouts during specific time macros, neutralizes their stops, then drives price the opposite way to offer smart money an offset at the next opposing liquidity pool. Every phase — Accumulation, Manipulation, Distribution — is chained to the clock.</p>"},{"id":"model","title":"The market model","html":"\n<p>Markets are delivered by an automated engine, time first then price, perpetually seeking liquidity to trap retail and rebalancing inefficiency to offer smart money an offset. Read the market as a sequence of algorithmic behaviors.</p>\n<h3>Step 1 — Liquidity (BSL/SSL and ERL/IRL)</h3>\n<ul>\n<li><b>External Range Liquidity (ERL):</b> stop orders outside the current range — <b>Buy-Side Liquidity (BSL)</b> = buy stops above old highs; <b>Sell-Side Liquidity (SSL)</b> = sell stops below old lows.</li>\n<li><b>Internal Range Liquidity (IRL):</b> structural inefficiencies inside the range — FVGs and order blocks.</li>\n</ul>\n<p>The cycle: price moves IRL → ERL and ERL → IRL. Sweep an old high (ERL) and it immediately seeks a discount FVG/OB (IRL) to rebalance.</p>\n<h3>Step 2 — Premium, discount, equilibrium</h3>\n<p>Identify the high and low of the lookback (e.g. the 20-day IPDA range). <b>Equilibrium</b> = the 50% midpoint. In a <b>premium</b> (upper half) you only look for shorts (targeting discount); in a <b>discount</b> (lower half) you only look for longs (targeting premium).</p>\n<h3>Step 3 — Power of 3 (AMD) and killzones</h3>\n<p>Institutional delivery runs a daily <b>Power of 3</b>: Accumulation, Manipulation, Distribution. Hunt only in the killzones — <b>London Open (2:00–5:00 AM ET)</b> and <b>New York Open (7:00–10:00 AM ET)</b>. Wait for the <b>Judas Swing</b>: manipulation opposite your bias (if bullish, price drops below the open) to raid liquidity and trap breakout traders.</p>\n<h3>Step 4 — Market Structure Shift (MSS) on displacement</h3>\n<ul>\n<li><b>Prerequisite:</b> a valid MSS only occurs <i>after</i> a liquidity raid — price must first run an old high/low to purge stops.</li>\n<li><b>Displacement:</b> price then reverses with extreme energy, breaking a recent short-term high (longs) / low (shorts).</li>\n<li><b>The wick rule:</b> an MSS does <i>not</i> require a candle body to close beyond the swing — a wick piercing the structure is sufficient.</li>\n<li><b>The imbalance:</b> the displacement must be aggressive enough to leave a fair value gap.</li>\n</ul>\n<h3>Step 5 — high-probability PD arrays</h3>\n<ul>\n<li><b>Fair Value Gap:</b> a 3-candle imbalance; in a bearish FVG the upper half is \"balanced\" — the true sensitivity is in the lower half (and vice versa for bullish). High-probability FVGs break away from a range and don't overlap old choppy price.</li>\n<li><b>Order Block:</b> the last down-close candle before an expansion swing — but it <i>must</i> be coupled with an FVG that forms right after. Sensitivity is at the open or the mean threshold (the 50% midpoint of the body).</li>\n<li><b>Breaker:</b> a failed order block — a bearish breaker forms on High → Low → Higher High (raiding BSL) then a break below the low; the last down-close candle between the two highs becomes the breaker.</li>\n</ul>\n<h3>Step 6 — Optimal Trade Entry (OTE)</h3>\n<ul>\n<li><b>The 62% rule:</b> anchor the fib from the low to the high of the displacement swing; OTE keys off the exact 62% retracement (prioritized over 70.5% / 79%).</li>\n<li><b>Entry buffer:</b> don't enter exactly at 62% — for longs, a buy limit at 62% <b>+ 5 pips</b>; for shorts, a sell limit at 62% <b>− 5 pips</b> (to account for spread).</li>\n<li><b>Stop:</b> 5 pips below the anchor swing low (longs) / 5 pips above the anchor swing high (shorts).</li>\n<li><b>Management:</b> don't move the stop to break-even until the position reaches exactly <b>75% of the profit objective</b>.</li>\n<li><b>Forex vs index futures:</b> the \"+5 pip\" entry buffer and the \"10/20/30 pip\" liquidity-run figures are <i>forex-specific</i>. Index futures (MNQ) are measured in points/handles and the corpus gives no exact point equivalent — treat them as \"a few ticks past the level\" and \"a small sweep beyond the old high/low\", not literal pips.</li>\n</ul>"},{"id":"glossary","title":"Concept glossary","html":"\n<h3>Fair Value Gap (FVG)</h3>\n<p>A range where one side of liquidity is exclusively offered, leaving a liquidity void on lower timeframes. <b>Nuance:</b> price gravitates back to fill the gap — but if an order block within the gap supports price, it may not fill completely, leaving a \"breakaway gap\" signalling extreme strength.</p>\n<h3>Order Block</h3>\n<p>A bullish OB is the lowest down-close candle (most range between open/close) near support, validated when a later candle trades through its high; a bearish OB is the last up-close candle before a down move. <b>Nuance:</b> focus on the candle <i>bodies</i> (open/close), not wicks — the crucial metric is the \"mean threshold,\" the 50% midpoint of the body; a valid OB shouldn't let price trade through this midpoint.</p>\n<h3>Breaker</h3>\n<p>A failed order block that flips to support/resistance on return. <b>Nuance:</b> a true breaker must be born from a stop run (turtle soup) that traps traders at an extreme — after the violent reversal, price stops at the breaker rather than returning to the extreme order block, stranding retail waiting for a deeper retracement.</p>\n<h3>Mitigation Block</h3>\n<p>A short-term swing where an MSS occurs <i>without</i> taking an old extreme (a failure swing, M/W pattern). <b>Nuance:</b> orders placed on that short-term swing are trapped \"underwater\" — smart money returns price to the last down/up candle to mitigate those losses to zero before driving in the intended direction.</p>\n<h3>Liquidity (BSL / SSL)</h3>\n<p>Pending orders resting in the market — BSL = buy stops above old highs, SSL = sell stops below old lows. <b>Nuance:</b> smart money treats these not as support/resistance but as targets to pair large orders against — driving price below an old low to trigger sell stops so they can accumulate longs at a discount (and vice versa).</p>\n<h3>ERL / IRL</h3>\n<p>External Range Liquidity is outside the range (buy stops above / sell stops below); Internal Range Liquidity is inside (liquidity voids, FVGs, order blocks). <b>Nuance:</b> the algorithm moves price like a pendulum between them — the highest-probability trades enter at IRL (a discount OB inside a range) and exit at ERL (above the old high where buy stops rest).</p>\n<h3>Equilibrium</h3>\n<p>The exact 50% midpoint of a defined swing. <b>Nuance:</b> it dictates fair value — below 50% is a \"discount\" (buy), above is a \"premium\" (sell); consolidations constantly seek to return to this mean.</p>\n<h3>OTE 62–79% (Optimal Trade Entry)</h3>\n<p>A deep discount/premium retracement between the 62%, 70.5%, and 79% fib levels of an impulse swing. <b>Nuance:</b> it works because it highlights the deepest discount/premium for the algorithm — only valid strictly below equilibrium (longs) or above (shorts), and it should overlap an FVG or order block.</p>\n<h3>Displacement</h3>\n<p>A sudden, rapid, impulsive swing moving aggressively away from equilibrium, consolidation, or an order block. <b>Nuance:</b> it's the fingerprint of institutional sponsorship — if the reaction at a level is lethargic and lacks energetic expansion, there's no smart money participation; abandon the trade.</p>\n<h3>MSS (Market Structure Shift)</h3>\n<p>Price breaking a significant short-term high (bullish) or low (bearish) following an impulse. <b>Nuance:</b> most potent immediately after a stop run (turtle soup) into a higher-timeframe PD array — once it occurs, retracements back into the new range are treated as safe entries.</p>\n<h3>Judas Swing</h3>\n<p>A false, protractionary move counter to the true daily direction, engineered to trick breakout traders and trigger stops. <b>Nuance:</b> highly time-sensitive — typically initiates at the 00:00 GMT open, the midnight NY open, or the 8:30 AM news embargo lift; smart money uses the fake expansion to accumulate its true positions.</p>\n<h3>Killzone</h3>\n<p>Specific high-volume windows where institutional order flow dominates — London 1:00–5:00 AM NY, New York 7:00–10:00 AM NY, London Close 10:00 AM–12:00 PM NY. <b>Nuance:</b> the day's high or low predominantly forms within these windows; a setup outside a killzone has far lower odds of institutional sponsorship.</p>\n<h3>Power of 3</h3>\n<p>The algorithmic blueprint of the daily Open-High-Low-Close: bullish day = open near the low, decline (Judas swing), expand higher, close near the high; bearish day = open near the high, rally (Judas), expand lower, close near the low. <b>Nuance:</b> on anticipated bullish days you must buy <i>at or below</i> the daily open; on bearish days sell <i>at or above</i> it.</p>"},{"id":"timing","title":"Timing & sessions","html":"\n<p>ICT originally taught the killzones in a <b>forex</b> context; for <b>index futures</b> (S&amp;P / Nasdaq / Dow e-minis — what applies to MNQ) he shifts the focus to the 9:30 equities open. The corpus distinguishes the two, so they're sorted below.</p>\n<h3>Forex killzones (ICT's original framing)</h3>\n<ul>\n<li><b>London Open Killzone — 1:00–5:00 AM ET</b> (some lectures quote 2:00–5:00 with opening range 1:30–2:00; the 1:00-vs-2:00 difference is forex-killzone framing / DST, not an index distinction). The prime \"Judas Swing\" session that traps retail before the true daily high/low; algorithmic sweet spot <b>3:30 AM ET</b>.</li>\n<li><b>New York Killzone — 7:00–10:00 AM ET</b> (purist 7:00–9:00, extends to 10:00 specifically for forex).</li>\n<li><b>London Close Killzone — 10:00 AM–12:00 PM ET.</b></li>\n</ul>\n<h3>Index-futures sessions (indices — what applies to MNQ)</h3>\n<ul>\n<li><b>NY AM session — 8:30–11:00 AM ET.</b> For futures, 7:00–9:30 is just pre-market ahead of the 9:30 bell. The true day high/low tends to form <b>9:30–10:30</b>; for AM index SMT, compare relative highs/lows between <b>5:00 AM and the 9:30 open</b>.</li>\n<li><b>AM Opening Range — strictly 9:30–10:00 AM ET.</b> The algorithm leaves the <b>1st Presented FVG</b> (the first 1-minute FVG at 9:31 or later with true breakaway displacement — never the 9:30 candle itself), extended forward as a reference all day.</li>\n<li><b>NY PM session — 1:00–4:00 PM ET.</b> The PM trend heats up ~<b>2:00 PM</b>; the true PM high/low forms in the final hour <b>3:00–4:00 PM</b>. The <b>PM Opening Range (1:30–2:00)</b> sets the afternoon (find its 1st Presented FVG).</li>\n</ul>\n<h3>Universal windows (all asset classes)</h3>\n<ul>\n<li><b>Midnight Opening Range (00:00–00:30 ET):</b> sets the daily-range boundary markers and founds the daily Power of 3; the algorithm refers back to the first displacement (FVG) inside it. Projecting standard deviations (−0.5, −1, −2.5) off this 30-minute range projects the daily high/low.</li>\n<li><b>7:00 AM ET algo fire-up:</b> algorithms across all asset classes come online (universal NY-open opening range 7:00–7:30); gauge the narrative from what liquidity was taken at <b>6:30 AM</b>.</li>\n<li><b>Silver Bullet hours — 10:00–11:00 AM &amp; 2:00–3:00 PM ET</b> (not distinguished by instrument): there has never been a day without an FVG in the 10:00 AM hour; in low-resistance conditions a new FVG forms in <i>every</i> 15-minute quarter.</li>\n<li><b>NY Lunch macro (11:30 AM–1:30 PM ET):</b> sneaky and stagnant — beginners avoid it; experienced traders use the first swing high after a marked 10:00 AM as the lunch-retracement draw.</li>\n<li><b>Final-hour macros:</b> the <b>2:50–3:10 PM</b> macro and the <b>Final Hour of RTH macro (3:15–3:45 PM)</b>, setting the final liquidity run into the 3:50 PM Market-On-Close algorithm.</li>\n<li><b>Universal 20-minute macros:</b> the last 10 minutes before and first 10 minutes after the top of the hour (e.g. 9:50–10:10, 10:50–11:10) — the algorithm spools price to form the leading candles that break structure and validate PD arrays.</li>\n</ul>"},{"id":"setups","title":"Signature setups, step-by-step","html":"\n<h3>1. NY AM V-Shape / Optimal Trade Entry (OTE)</h3>\n<ul>\n<li><b>Context:</b> stalked in the NY killzone (7:00–10:00 AM ET), looking for a retracement against London's momentum.</li>\n<li><b>Trigger:</b> price retraces into the exact 62% fib of the dealing range.</li>\n<li><b>Entry:</b> a limit at 62% <b>+ 5 pips</b> (longs) / <b>− 5 pips</b> (shorts) for spread.</li>\n<li><b>Stop:</b> exactly 5 pips below the anchor swing low (longs) / above the anchor swing high (shorts); don't move to break-even until 75% of the profit objective.</li>\n<li><b>Target:</b> first partials at the day's anchor high/low, then 10/20/30 pips beyond the previous day's range into external liquidity.</li>\n<li><b>Nuance:</b> draw the fib using candle <b>bodies</b> to capture core volume — ignore the wicks.</li>\n</ul>\n<h3>2. Silver Bullet</h3>\n<ul>\n<li><b>Context:</b> time-based continuation strictly within the 10:00–11:00 AM or 2:00–3:00 PM ET hour.</li>\n<li><b>Trigger:</b> a displacement swing that leaves an FVG within that 60-minute window.</li>\n<li><b>Entry:</b> a limit as price retraces into the FVG, targeting the gap extreme or its consequent encroachment (midpoint).</li>\n<li><b>Stop:</b> beyond the local swing extreme that preceded the displacement gap.</li>\n<li><b>Target:</b> opposing session liquidity, or standard deviations mapped from the 30-minute opening range.</li>\n<li><b>Nuance:</b> it's algorithmically time-bound — there has never been a day where an FVG didn't form in the 10:00 AM hour; if you missed the 9:30 opening range, wait for 10:00.</li>\n</ul>\n<h3>3. Judas Swing / Turtle Soup</h3>\n<ul>\n<li><b>Context:</b> the manipulation phase of the daily Power of 3, launching in the London or NY open.</li>\n<li><b>Trigger:</b> price drives opposite your true bias, running 10/20/30 pips above an old high (BSL) or below an old low (SSL) to trap breakout traders.</li>\n<li><b>Entry:</b> immediate execution into the stop hunt as it sweeps external liquidity — stepping in as retail stops trigger.</li>\n<li><b>Stop:</b> above the highest sweep wick (shorts) / below the lowest sweep wick (longs).</li>\n<li><b>Target:</b> price cycling back inside the range to opposing IRL (a discount FVG/OB) or the opposite side.</li>\n<li><b>Nuance:</b> wicks do the damage, bodies tell the truth — a valid turtle soup sees long wicks pierce the pools while the bodies close back inside the dealing range, confirming smart money stepped in as counterparty.</li>\n</ul>\n<h3>4. MSS + FVG Entry (the 2022 model)</h3>\n<ul>\n<li><b>Context:</b> 5m→1m within an index macro (e.g. 8:30–11:00 AM ET); a clear liquidity raid on an old high/low must have just occurred.</li>\n<li><b>Trigger:</b> aggressive displacement reversing from the pool that causes a rapid MSS and leaves an FVG (at/above equilibrium for shorts; at/below for longs).</li>\n<li><b>Entry:</b> a limit at the anatomy of the 3-candle gap — the high of the discount low (shorts) / the low of the premium high (longs).</li>\n<li><b>Stop:</b> at the extreme of the 3-candle gap (removing the 5-pip buffer).</li>\n<li><b>Target:</b> ride the expansion from the entry PD array to an opposing PD-array objective (premium FVG → discount FVG / old session low).</li>\n<li><b>Nuance:</b> a valid MSS does <b>not</b> require a body close beyond the swing — a wick breaking structure with heavy displacement is sufficient.</li>\n</ul>"},{"id":"example","title":"Worked example","html":"\n<p>A 5-minute NASDAQ chart, 9:20 AM ET. Higher-timeframe daily flow is bearish, so the ultimate draw is the SSL below yesterday's low. But the algorithm cycles IRL↔ERL, so it must engineer a trap first — mark the relative equal highs from pre-market as external BSL above.</p>\n<h3>Step 1 — the liquidity sweep &amp; Power of 3 (9:30)</h3>\n<p>The bell rings; sit on your hands. The market shoots up, smashing the pre-market highs — the <b>Judas Swing</b> (Power-of-3 manipulation), raiding BSL and tricking breakout buyers. The wicks pierce the highs to trigger stops, but the bodies respect the institutional levels — smart money is accumulating shorts into the retail buy stops.</p>\n<h3>Step 2 — dis
