# ---- Capabilities & Skills registry (single source of truth) ----
# Rendered into the dashboard AND into the auto-loaded memory file capabilities.md
# (so Claude Code knows at session start what already exists + is TESTED -> never re-derive/rebuild).
# Built tools = full detail. Custom skills = full detail. Outsourced = categorized index (not line-by-line).
capabilities:
  built_tools:
    - name: "social-rip"
      what: "Rip an entire X/YouTube/Discord handle (text+images+audio+video) to disk + manifest"
      run: "python3 ~/.claude/skills/social-rip/bin/social_rip.py <url|@handle> [--mode full|media|text] [--range 1-N]"
      status: "TESTED"
    - name: "video pipeline (yt-dlp + local whisper)"
      what: "Download any video (X via yt-dlp, YouTube native) + transcribe locally; claude-video-vision backend=local (whisper-cpp base). Gemini key is DEAD - do not use gemini backend."
      run: "/watch-video <url|path>  (yt-dlp downloads non-YouTube e.g. X first)"
      status: "TESTED"
    - name: "gallery-dl"
      what: "Image + post-text/metadata ripper across hundreds of sites (X, Discord, Bluesky...). X needs login via browser cookies."
      run: "gallery-dl --cookies-from-browser chrome <url>"
      status: "TESTED"
    - name: "fable bridge"
      what: "Query project-aware Fable 5 (claude.ai) as a skeptical external analyst from inside Claude Code"
      run: "/fable-consult   (or python3 ~/mnq_trading/tools/fable_bridge/consult.py)"
      status: "TESTED"
    - name: "x_scraper (trading)"
      what: "WebBridge GraphQL capture of trader X feeds -> SQLite -> classify/correlate trade signals (NOT general archival; use social-rip for that)"
      run: "python3 ~/mnq_trading/tools/x_scraper/xcap.py --probe <handle>"
      status: "SCAFFOLD (needs one --probe run to lock daemon field paths)"
    - name: "mnq-server relay"
      what: "Railway TV-webhook -> Tradovate API execution relay + /dashboard + Telegram"
      run: "Railway project mnq-server/production (AUTOMATION_ENABLED=false)"
      status: "LIVE (paper relay, automation OFF)"
    - name: "dashboard generator"
      what: "This dashboard: project_state.yaml + git + memory -> HTML + Obsidian + capabilities.md (one source, three renders)"
      run: "python3 ~/mnq_trading/diagnostics/build_dashboard.py"
      status: "TESTED"
  custom_skills:
    - name: "social-rip"
      what: "rip a social handle's full media (X TESTED; YouTube/Discord routed)"
    - name: "research-critiquer"
      what: "independent PASS/REVISE gate for trading engines"
    - name: "fable-consult"
      what: "skeptical external Fable 5 analyst on the trading project"
    - name: "gxt-entry-model"
      what: "validate a GxT-style intraday entry (Universal Sequence + SMT triad)"
    - name: "propfirm-selector"
      what: "compare futures prop firms to a strategy"
  outsourced_index:
    - "gstack (~50): browse, ship, land-and-deploy, codex, design-*, plan-* reviews, health, investigate, careful/guard/freeze, context-save/restore"
    - "ecc plugin (~200): per-language reviewers/builders, security-scan, agent-*, *-patterns, ito-*, healthcare-*, deep-research"
    - "document-skills: docx/pdf/pptx/xlsx, frontend-design, mcp-builder, skill-creator, webapp-testing"
    - "superpowers: brainstorming, TDD, systematic-debugging, writing-plans, dispatching-parallel-agents"
    - "claude-mem: mem-search, learn-codebase, timeline-report"
    - "infra MCP/skills: kimi-webbridge (browser), notebooklm, claude-video-vision, computer-use"
    - "Full live list = the Skill tool registry surfaced each session."
